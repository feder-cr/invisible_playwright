# Site config for https://feder-cr.github.io/invisible_playwright/
#
# EVERY PAGE HAS FRONT MATTER (since 2026-07-27), reversing the original
# no-front-matter decision. jekyll-seo-tag was giving every page the same
# <meta name="description"> - the repository's own blurb - because with no
# front matter there was nothing page-specific to read. Front matter costs a
# rendered metadata table above the file on github.com; the fix keeps `title`
# identical to the page's own H1 so the sidebar label and the <title> tag
# stay the same text they always were, and adds `description` purely for the
# per-page meta tag.
#
# Since 2026-07-28 front matter also carries the nav hierarchy: `parent`,
# `grand_parent` and `has_children` group pages into Documentation / Guides
# (with 7 sub-categories) / Comparisons / Integrations instead of one flat
# alphabetical sidebar. See docs/guides.md and docs/documentation.md for the
# top of each branch.
#
# THE SITE ROOT IS docs/index.md, NOT docs/README.md. Tried
# jekyll-readme-index first (2026-07-28) to serve README.md at the bare
# domain without a separate index file; the build reported success but the
# root still 404'd, so it is not actually active under GitHub Pages' safe
# plugin list here. index.md is the real homepage; README.md is now a short
# pointer, kept only so the folder still shows something sensible when
# browsed directly on github.com.

title: invisible_playwright
description: >-
  Undetected Playwright automation on a stealth-patched Firefox. Notes on browser
  fingerprinting and bot detection, written from the detectors' own source and from
  our release gates.

url: https://feder-cr.github.io
baseurl: /invisible_playwright

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-sitemap

logo: "/invisible_playwright-logo.png"
favicon_ico: "/invisible_playwright-logo.png"

color_scheme: dark

# Lunr index, built at page-build time. No extra service, no key.
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "GitHub":
    - "https://github.com/feder-cr/invisible_playwright"
  "PyPI":
    - "https://pypi.org/project/invisible-playwright/"
aux_links_new_tab: true

footer_content: >-
  MIT licensed. Every page here is written against the current source of the thing
  it describes, and several record something we got wrong first.

exclude:
  - _config.yml
