# popups-iso-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/popups-iso**` branch.
#
# The proof of the popup fix 7d934a6 left 13 red tests in 20 runs on engine 63 + core 63.66.0 + release/0.51.0 with the fix
# (run 43241161889) and 2 on the published engine 62 + main's core + main with the fix's server.py (run 43242942066). The two
# arms differed in three things; these two arms change one each, so the cause is named by the run and not guessed:
#   iso-63-main  engine firefox-63 (release asset) + core 63.66.0 (PyPI) + main with the fix's server.py
#   iso-63-main-core62  the same with core 62.65.0: main (0.50.1) does not run on core 63.66.0 (SessionGeo has no srflx_to_declare, run 43251022743)
#   iso-62-rel   engine firefox-62 (release asset) + core 63.66.0 (PyPI) + this branch (release/0.51.0 + the fix)
# Both: tests/test_popups_reach_the_client_e2e.py twenty times at four workers, with the popup trace. The engine is sealed
# locally for both arms, as in the proof.
name: popups iso hunt

on:
  push:
    branches: ['hunt/popups-iso**']

permissions:
  contents: read

concurrency:
  group: popups-iso-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  INVISIBLE_CORE_AUTOFIX: 'off'
  INVISIBLE_CORE_PIN: allow

jobs:
  hunt:
    name: ${{ matrix.arm }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { arm: iso-63-main-core62, engine: firefox-63 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: main with the fix and the trace (arm iso-63-main only)
        if: matrix.arm == 'iso-63-main-core62'
        run: |
          set -e
          cp scripts/hunt_popup_trace_patch.py scripts/hunt_popup_trace_patch2.py scripts/hunt_popup_fix_server.patch "$RUNNER_TEMP/"
          git -c core.autocrlf=false checkout origin/main -- src tests pyproject.toml scripts/playwright_pin.txt
          python -c "import sys; p=sys.argv[1]; d=open(p,'rb').read(); open(p,'wb').write(d.replace(bytes([13,10]), bytes([10])))" "$RUNNER_TEMP/hunt_popup_fix_server.patch"
          git -c core.autocrlf=false apply "$RUNNER_TEMP/hunt_popup_fix_server.patch"
          python "$RUNNER_TEMP/hunt_popup_trace_patch.py"
          python "$RUNNER_TEMP/hunt_popup_trace_patch2.py"
          git log -1 --format='main at %h' origin/main
      - name: Install (core 62.65.0 from PyPI, the wrapper without resolving its pin)
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "invisible-core==62.65.0" "websockets>=13" "aioquic>=1.2" "pytest>=7" \
            "pytest-rerunfailures>=14" "pytest-timeout>=2" "pytest-xdist>=3" "cryptography>=41" "h2>=4,<5" psutil
          python -m pip install --quiet --no-deps "."
          python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          python -c "import importlib.metadata as m; print('invisible-playwright', m.version('invisible-playwright'), '| invisible-core', m.version('invisible-core'))"
      - name: The engine ${{ matrix.engine }}, sealed locally
        run: |
          set -e
          mkdir -p art ff
          gh release download "${{ matrix.engine }}" --repo feder-cr/firefox_antidetect_patch --pattern '*-stealth-win-x86_64.zip' --dir art
          python -c "import glob, zipfile; zipfile.ZipFile(glob.glob('art/*-stealth-win-x86_64.zip')[0]).extractall('ff')"
          FFEXE=$(python -c "import glob; print(sorted(glob.glob('ff/**/firefox.exe', recursive=True))[0])")
          python -m invisible_core seal --binary "$PWD/$FFEXE" --tag "${{ matrix.engine }}-iso" -o "$PWD/seal.json"
          echo "FF=$PWD/$FFEXE" >> "$GITHUB_ENV"; echo "INVISIBLE_SEAL_FILE=$PWD/seal.json" >> "$GITHUB_ENV"
          grep -hE "^(Version|BuildID|SourceStamp)=" "$(dirname "$FFEXE")/application.ini" || true
      - name: The popup file twenty times, four workers, with the trace
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          export INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF"
          mkdir -p evidence
          red=0
          for n in $(seq 1 20); do
            rr=$(printf '%02d' "$n")
            export INVPW_HUNT_POPUP_TRACE="$PWD/evidence/trace_$rr.jsonl"
            set +e
            python -m pytest tests/test_popups_reach_the_client_e2e.py -m e2e -o addopts= -p no:cacheprovider \
              -n 4 --dist loadfile --timeout 420 -q -rA --tb=short > "evidence/run_$rr.log" 2>&1
            set -e
            f=$(grep -cE "^(FAILED|ERROR) " "evidence/run_$rr.log" || true)
            red=$((red+f))
            echo "run $n: red=$f $(tail -1 evidence/run_$rr.log)"
          done
          {
            echo "## ${{ matrix.arm }}: red tests in the 20 runs of the popup file: $red"
            echo '```'
            grep -hE "^(FAILED|ERROR) " evidence/run_*.log | sed -E 's/^(FAILED|ERROR) //' | cut -c1-220 | sort | uniq -c | sort -rn | head -20 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: popups-iso-${{ matrix.arm }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
