# same-site-diag.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/same-site**` branch.
#
# tests/test_fission_strategy1_bench.py::test_same_site_other_port_stays_in_process was red in 14 of 30 runs of the whole
# e2e suite ("a same-site frame changed the processes of the sites: [P] -> [P, P2]") and never when run alone. This job
# repeats a copy of it that records what P2 is: whose child, when it was born against the instants of the test, and what the
# engine logged when it started it. Two phases: four workers on this file alone, then the same while other e2e tests run.
name: same-site diag

on:
  push:
    branches: ['hunt/same-site**']

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  diag:
    name: what is the second process
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ pinned Playwright)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: Phase 1, four workers on the copies of the control
        env:
          INVPW_BINARY_PATH: ${{ env.FF }}
          PYTHONUNBUFFERED: "1"
          DIAG_REPS: "20"
        run: |
          set -u
          mkdir -p evidence/phase1
          export DIAG_DIR="$PWD/evidence/phase1"
          set +e
          xvfb-run -a python -m pytest tests/test_fission_strategy1_bench.py -k "test_diag" -m e2e -o addopts= \
            -p no:cacheprovider -n 4 --dist load --timeout 300 -q > evidence/phase1/pytest.log 2>&1
          echo "phase 1 pytest exit=$?"
          set -e
          tail -5 evidence/phase1/pytest.log
          python scripts/same_site_diag_report.py evidence/phase1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Phase 2, the same while other e2e tests run on two more workers
        env:
          INVPW_BINARY_PATH: ${{ env.FF }}
          PYTHONUNBUFFERED: "1"
          DIAG_REPS: "20"
        run: |
          set -u
          mkdir -p evidence/phase2
          export DIAG_DIR="$PWD/evidence/phase2"
          (
            set +e
            while [ ! -e evidence/phase2/done ]; do
              xvfb-run -a python -m pytest tests/test_juggler_actions.py -m e2e -o addopts= -p no:cacheprovider -n 2 \
                --timeout 300 -q >> evidence/phase2/load.log 2>&1
            done
          ) &
          load=$!
          set +e
          xvfb-run -a python -m pytest tests/test_fission_strategy1_bench.py -k "test_diag" -m e2e -o addopts= \
            -p no:cacheprovider -n 2 --dist load --timeout 300 -q > evidence/phase2/pytest.log 2>&1
          echo "phase 2 pytest exit=$?"
          set -e
          touch evidence/phase2/done
          wait "$load" || true
          tail -5 evidence/phase2/pytest.log
          python scripts/same_site_diag_report.py evidence/phase2 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload all the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: same-site-diag-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
