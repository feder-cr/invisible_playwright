name: fakeweb-p2 (engine of a series run, reduced: the hard pages and the quiet one)

# The fake web, profile P2, on the engine a RUN of the series repository built (its `asset-win-x86_64` artifact), in the same job as
# Playwright's own Firefox: the verdict is "the same outcome as stock", per page, with the numbers. The series repository is public, so
# `gh run download` needs no secret. To run it on another engine, change ENGINE_RUN_ID and push: this workflow starts on a push that
# touches this file (a hunt, not a gate). REDUCED: the run on every page took more than its 60 minutes (cancelled at the ceiling, run 43178594622),
# so this one runs the three hard pages (HARD in scripts/run_fakeweb.py) and the quiet one, 10 repetitions, in 45 minutes.

on:
  push:
    paths:
      - '.github/workflows/fakeweb-p2.yml'
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: 'run of feder-cr/firefox_antidetect_patch whose asset-win-x86_64 artifact is the engine'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  ENGINE_RUN_ID: ${{ inputs.engine_run_id || '43164943499' }}
  ENGINE_REPO: feder-cr/firefox_antidetect_patch

jobs:
  p2:
    name: fakeweb P2 (windows, engine of run ${{ inputs.engine_run_id || '43164943499' }})
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper + test deps, and Playwright's own Firefox as the control
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)" psutil
          python -m playwright install firefox
      - name: The engine of the run
        run: |
          mkdir -p engine
          gh run download "$ENGINE_RUN_ID" --repo "$ENGINE_REPO" --name asset-win-x86_64 --dir engine/archive
          ls -la engine/archive
          python - <<'PY'
          import glob, zipfile
          z = glob.glob("engine/archive/*.zip")[0]
          zipfile.ZipFile(z).extractall("engine/x")
          print("extracted", z)
          PY
          python -m invisible_core seal --binary engine/x/firefox.exe --tag firefox-63-candidate -o "$PWD/engine/seal.json"
          echo "INVPW_BINARY_PATH=$PWD/engine/x/firefox.exe" >> "$GITHUB_ENV"
          echo "INVISIBLE_SEAL_FILE=$PWD/engine/seal.json" >> "$GITHUB_ENV"
          echo "INVISIBLE_CORE_PIN=allow" >> "$GITHUB_ENV"
      - name: The fake web beside stock, per page
        run: |
          python scripts/run_fakeweb.py --binary "$INVPW_BINARY_PATH" --repetitions 10 --patterns leaving_beacons_subframe,leaving_beacons,cancel_among_beacons,quiet --out fakeweb-p2.json || echo "RUN_FAKEWEB_EXIT=$?" >> "$GITHUB_ENV"
          python - <<'PY'
          import collections, json
          r = json.load(open("fakeweb-p2.json"))
          rows = collections.defaultdict(lambda: [0, 0, 0, 0])
          for who, idx in (("candidate", 0), ("stock", 2)):
              for c in r[who]:
                  rows[c["pattern"]][idx + (0 if c["idle"] else 1)] += 1
          print("%-30s %12s %12s" % ("page", "engine idle/not", "stock idle/not"))
          for p, v in sorted(rows.items()):
              print("%-30s %6d/%-5d %6d/%-5d" % (p, v[0], v[1], v[2], v[3]))
          print("fails (engine not idle where stock idles):", len(r["fails"]), "broken controls:", len(r["broken_control"]))
          PY
      - name: The mandatory case under a load of other browsers (three loaders of ours)
        if: always()
        run: python -m pytest tests/test_fakeweb_p2_e2e.py -m e2e -q -p no:cacheprovider -rA
      - name: Upload the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fakeweb-p2-${{ github.run_id }}
          path: fakeweb-p2.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verdict of the fake web run
        if: always()
        run: |
          if [ -n "${RUN_FAKEWEB_EXIT:-}" ]; then echo "run_fakeweb.py exited ${RUN_FAKEWEB_EXIT}: red"; exit 1; fi
