# ─────────────────────────────────────────────────────────────────────────────
# upstream.yml - run Microsoft's OWN Playwright Python test suite against this
# client, and fail when a test that passed in the recorded baseline stops
# passing.
#
# Why. This package replaces the Node driver with its own client, and the one
# independent judge of whether that client still behaves like Playwright is the
# suite Microsoft wrote for theirs. It used to be launched by hand, so a
# regression showed up whenever somebody remembered to look. Most of the suite
# is red on purpose or for known reasons (this package refuses names that
# Playwright has, and some features are not built yet), so the question asked
# here is not "is it green" but "did anything that worked stop working", and
# the answer comes from tests/gates/upstream_baseline.json.
#
# Where the tests come from. They are not in this repository (the folder is
# ignored: it is Apache-2.0 code in an MIT tree). Each job clones
# microsoft/playwright-python at the tag named in scripts/playwright_pin.txt and
# puts its `tests/` and its `pyproject.toml` under tests/playwright-upstream/,
# which is the layout the baseline's test ids (`tests.sync.<module>::...`) were
# recorded with. The clone is checked against a commit SHA, so a tag that moves
# cannot change what is measured.
#
# How it is split. The sync arm is ~700 tests and ~50 minutes of work. It runs
# as 7 shards on Linux and 8 on Windows (15 jobs), and a shard owns whole test
# FILES (scripts/upstream_baseline.py --shard K/N). Which files is decided by
# how long each took in a recorded run (tests/gates/upstream_weights.json,
# heaviest first into the lightest shard), not by a hash of the path: the time
# of this suite sits in a handful of tests that wait for a timeout (and are run
# four times), so a hash gave shards of 3, 7, 14 and more than 16 minutes. Two
# files, `test_request_intercept` and `test_browsercontext_request_intercept`,
# take 8 to 10 minutes alone (four or five tests of 2 minutes each), so each is
# cut in two by test id and its parts go to different shards
# (scripts/upstream_split.py deselects the other part). The weights predict
# every shard at 7.5 minutes of tests or less; the step limit is about twice
# that. When the plan changes, update `include:` below and the VERDICT line in
# the verdict job; the unit test names whichever disagrees. The `verdict` job
# merges the shards of each OS and judges them; a shard job only has to
# deliver its report.
#
# A shard that hits its limit is killed before pytest writes its junit, so each
# shard also appends one line per test report to a `.jsonl` record as it runs
# (--record, scripts/upstream_record.py) and uploads it next to the junit.
# `upstream_baseline.py --write-weights` reads both, so the next plan is
# measured even when a shard times out. The verdict is not softened by it: a
# shard without a junit is red.
#
# What makes it fail (the verdict job):
#   - a shard job did not succeed, or its junit report is missing or unreadable;
#   - fewer than 95% of the recorded tests were collected on an OS (a shard that
#     died takes its tests with it, and what is not collected cannot regress);
#   - a test that passed in the baseline no longer passes, on either OS.
# The baseline was recorded on Linux. Windows is judged against the same file;
# where Windows differs from Linux the job summary lists it in its own section,
# so a platform difference reads as one and not as a regression of the client.
#
# Secret-free: the engine is the PUBLIC release, and the only network used is
# GitHub, the package index and the upstream repository.
# ─────────────────────────────────────────────────────────────────────────────
name: upstream

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    # The same filter as `push`: a filter on one trigger only is not a filter.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. Only a pull request is cancelled by a newer
# push: a run on main is a measurement of that commit, and cancelling it would
# leave a hole in the history of what main passed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Engine downloads go through the release API with this token: anonymous
# requests share a 60-an-hour limit per runner address and are the first ones
# GitHub drops when it is degraded.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # `pip install` below resolves the pinned `invisible-core` from the index.
  # While it is not published yet the jobs are SKIPPED with the reason in the
  # run summary, not faked green. See core-on-index.yml.
  core-on-index:
    uses: ./.github/workflows/core-on-index.yml

  upstream:
    name: upstream ${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.of }}
    needs: core-on-index
    if: needs.core-on-index.outputs.available == 'true'
    runs-on: ${{ matrix.os }}
    # The test step is limited below (`limit`); this adds the install and the
    # clone. A hang must be a failed job with a log, not a run that sits until
    # somebody notices.
    timeout-minutes: ${{ matrix.job }}
    strategy:
      # One red cell must not hide the others: the verdict needs every report.
      fail-fast: false
      matrix:
        # One entry per job. `of` is the shard count of that OS, `limit` the
        # minutes the test step may take (about twice what the weights predict
        # for that shard), `job` that plus the install and the clone.
        include:
          - { os: ubuntu-24.04, shard: 1, of: 7, limit: 14, job: 22 }
          - { os: ubuntu-24.04, shard: 2, of: 7, limit: 14, job: 22 }
          - { os: ubuntu-24.04, shard: 3, of: 7, limit: 14, job: 22 }
          - { os: ubuntu-24.04, shard: 4, of: 7, limit: 14, job: 22 }
          - { os: ubuntu-24.04, shard: 5, of: 7, limit: 14, job: 22 }
          - { os: ubuntu-24.04, shard: 6, of: 7, limit: 14, job: 22 }
          - { os: ubuntu-24.04, shard: 7, of: 7, limit: 14, job: 22 }
          - { os: windows-latest, shard: 1, of: 8, limit: 13, job: 21 }
          - { os: windows-latest, shard: 2, of: 8, limit: 13, job: 21 }
          - { os: windows-latest, shard: 3, of: 8, limit: 13, job: 21 }
          - { os: windows-latest, shard: 4, of: 8, limit: 13, job: 21 }
          - { os: windows-latest, shard: 5, of: 8, limit: 13, job: 21 }
          - { os: windows-latest, shard: 6, of: 8, limit: 13, job: 21 }
          - { os: windows-latest, shard: 7, of: 8, limit: 13, job: 21 }
          - { os: windows-latest, shard: 8, of: 8, limit: 13, job: 21 }
    # On Windows GitHub runs `run:` blocks with PowerShell by default; these
    # are bash, as in e2e-hunt.yml.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          # The playwright package is not imported by the product; it is here
          # for `playwright install-deps` on Linux, and pinned to the version
          # whose tests are fetched below.
          python -m pip install "playwright==$(tr -d '[:space:]' < scripts/playwright_pin.txt)"
          # The runtime libraries the upstream conftest imports (its own
          # local-requirements.txt, with autobahn at the first release pip
          # accepts: 23.1.2 declares a direct URL dependency). pytest and its
          # plugins stay the wrapper's.
          python -m pip install "autobahn>=24.4.2" "twisted==25.5.0" \
            "pyOpenSSL==26.0.0" "service_identity==24.2.0" "Pillow==11.3.0" \
            "pixelmatch==0.3.0" "objgraph==3.6.2" "asyncio-atexit==1.0.1"
      - name: System deps (xvfb + Firefox runtime libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: Fetch Playwright's own tests at the pinned tag
        env:
          # The commit the tag v1.61.0 points to. Change it together with
          # scripts/playwright_pin.txt: the check below names both when they
          # disagree.
          UPSTREAM_SHA: bd499b293b93a1f9e4d2667df06f9708c65f6dde
        run: |
          tag="v$(tr -d '[:space:]' < scripts/playwright_pin.txt)"
          # core.autocrlf=false: the suite compares bytes of golden files and
          # of served assets, and a Windows checkout must not rewrite them.
          for attempt in 1 2 3; do
            rm -rf .upstream-src
            if git -c core.autocrlf=false clone --quiet --depth 1 --branch "$tag" \
                 https://github.com/microsoft/playwright-python.git .upstream-src; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not clone microsoft/playwright-python at $tag"
              exit 1
            fi
            sleep 10
          done
          head=$(git -C .upstream-src rev-parse HEAD)
          if [ "$head" != "$UPSTREAM_SHA" ]; then
            echo "::error::$tag is $head, but this workflow pins $UPSTREAM_SHA (update UPSTREAM_SHA with scripts/playwright_pin.txt)"
            exit 1
          fi
          mkdir -p tests/playwright-upstream
          cp -R .upstream-src/tests tests/playwright-upstream/tests
          # Its pytest settings at the root of the copy, so pytest roots there
          # and names modules `tests.sync.*`, as the baseline does.
          cp .upstream-src/pyproject.toml tests/playwright-upstream/pyproject.toml
          rm -rf .upstream-src
      - name: Run this shard of the sync arm
        # Bounded below the job ceiling so the upload step still gets to run.
        timeout-minutes: ${{ matrix.limit }}
        env:
          PYTHONUNBUFFERED: "1"
          MOZ_CRASHREPORTER_DISABLE: "1"
        run: |
          # Linux gets a virtual display; on Windows the browser opens on the
          # runner's desktop, as in e2e-hunt.yml.
          if [ "$RUNNER_OS" = "Linux" ]; then PRE="xvfb-run -a"; else PRE=""; fi
          junit="upstream-${RUNNER_OS}-${{ matrix.shard }}.xml"
          record="upstream-${RUNNER_OS}-${{ matrix.shard }}.jsonl"
          set +e
          $PRE python -u scripts/upstream_baseline.py "$FF" --which sync \
            --shard "${{ matrix.shard }}/${{ matrix.of }}" --junit-xml "$junit" \
            --record "$record"
          code=$?
          set -e
          # pytest exits 1 whenever one test fails, and most of this suite is
          # red by design, so 1 is the normal outcome here. What is not normal
          # is 2+ (interrupted, internal error, usage, nothing collected) or a
          # report that was never written (the process was killed by the
          # per-test timeout before pytest could write it).
          echo "pytest exit code: $code"
          if [ "$code" -gt 1 ]; then
            echo "::error::pytest ended abnormally (exit $code)"
            exit 1
          fi
          if [ ! -s "$junit" ]; then
            echo "::error::no junit report was written ($junit)"
            exit 1
          fi
      # `always()`: a failed shard's partial evidence is the most useful part.
      # `overwrite` so that re-running a failed job replaces its old report.
      - name: Upload this shard's report and record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-junit-${{ runner.os }}-${{ matrix.shard }}
          path: |
            upstream-${{ runner.os }}-${{ matrix.shard }}.xml
            upstream-${{ runner.os }}-${{ matrix.shard }}.jsonl
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  verdict:
    name: upstream verdict
    needs: [core-on-index, upstream]
    # `always()` so it still judges when a shard failed. Skipped (not green)
    # while the core is not on the index, like the jobs it waits for.
    if: always() && needs.core-on-index.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # `gh run download` reads this run's artifacts.
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Every shard job succeeded
        env:
          UPSTREAM_RESULT: ${{ needs.upstream.result }}
        run: |
          if [ "$UPSTREAM_RESULT" != "success" ]; then
            echo "::error::the shard jobs ended '$UPSTREAM_RESULT', not 'success'"
            exit 1
          fi
      - name: Download every shard's report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'upstream-junit-*' --dir junit
          find junit -type f | sort
      - name: Merge each OS and compare it with the baseline
        if: always()
        run: |
          status=0
          {
            echo "## Upstream Playwright suite"
            echo
            echo "The baseline was recorded on Linux; Windows is judged against the same file."
          } >> "$GITHUB_STEP_SUMMARY"
          # VERDICT: the shard count of each OS, as in `include:` above.
          for plan in Linux:7 Windows:8; do
            os="${plan%%:*}"
            count="${plan##*:}"
            files=()
            for k in $(seq 1 "$count"); do
              f="junit/upstream-junit-$os-$k/upstream-$os-$k.xml"
              if [ ! -s "$f" ]; then
                echo "::error::$os shard $k delivered no junit report ($f)"
                status=1
              fi
              files+=("$f")
            done
            extra=()
            if [ "$os" = "Windows" ] && [ -s merged-Linux.json ]; then
              extra=(--compare-to merged-Linux.json --diff-out "differs-$os.txt")
            fi
            # 0.95: a few tests renamed upstream do not trip it. A lost shard
            # does not need it: its job fails, and a missing report is an
            # error above, whatever share of the tests it owned.
            python scripts/upstream_regressions.py --check --min-fraction 0.95 \
              --save-merged "merged-$os.json" "${extra[@]}" "${files[@]}" \
              > "report-$os.txt" 2>&1 || { status=1; echo "::error::$os did not pass the comparison"; }
            cat "report-$os.txt"
            {
              echo
              echo "### $os against the baseline"
              echo '```'
              tail -n 300 "report-$os.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -s "differs-$os.txt" ]; then
              {
                echo
                echo "### Windows differs from Linux (informational, listed apart)"
                echo '```'
                cat "differs-$os.txt"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$status"
      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-verdict
          path: |
            report-*.txt
            merged-*.json
            differs-*.txt
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
