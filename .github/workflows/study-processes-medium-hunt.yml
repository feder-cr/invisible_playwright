# study-processes-medium-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/study-processes-medium**` branch.
#
# Run 43355270060 (ProcessModel 109cc93): on the Windows runner, an administrator, our tabs ran at LOW integrity where the retail's
# ran UNTRUSTED, our GPU process MEDIUM where the retail's was LOW, our parent HIGH where the retail's was MEDIUM (its launcher
# process starts the browser again de-elevated). The same study, both browsers started from a Basic User token
# (`runas /trustlevel:0x20000`: the administrators group off, medium integrity), as a user's browser starts: does the difference
# come from the elevation or from our sandbox? Windows only; nothing of the product changes.
name: study processes medium hunt

on:
  push:
    branches: ['hunt/study-processes-medium**']

permissions:
  contents: read

concurrency:
  group: study-processes-medium-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  study:
    name: study medium (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        os: [windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper, the published engine, the retail Firefox 159.0
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet ".[dev]" psutil
          echo "OURS=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
          curl -sSL -o "$RUNNER_TEMP/setup.exe" "https://archive.mozilla.org/pub/firefox/releases/159.0/win64/en-US/Firefox%20Setup%20159.0.exe"
          "$RUNNER_TEMP/setup.exe" /S "/InstallDirectoryPath=C:\retail159"
          for i in $(seq 1 60); do [ -f /c/retail159/firefox.exe ] && break; sleep 2; done
          echo "RETAIL=C:\retail159\firefox.exe" >> "$GITHUB_ENV"
      - name: The study from a Basic User token (medium integrity, no administrators group)
        shell: pwsh
        run: |
          $py = (python -c "import sys; print(sys.executable)").Trim()
          $out = Join-Path $env:GITHUB_WORKSPACE "evidence"
          New-Item -ItemType Directory -Force $out | Out-Null
          $cmd = Join-Path $env:RUNNER_TEMP "study.cmd"
          $done = Join-Path $env:RUNNER_TEMP "study.done"
          Set-Content -Encoding ascii $cmd @(
            "@echo off",
            "cd /d `"$env:GITHUB_WORKSPACE`"",
            "`"$py`" scripts\study_processes.py --retail `"$env:RETAIL`" --ours `"$env:OURS`" --out `"$out`" --seconds 30 --repeat 3 > `"$out\study.log`" 2>&1",
            "echo %ERRORLEVEL% > `"$done`""
          )
          whoami /groups | Select-String "Mandatory Label"
          runas /trustlevel:0x20000 "$cmd"
          for ($i = 0; $i -lt 160 -and -not (Test-Path $done); $i++) { Start-Sleep 5 }
          if (-not (Test-Path $done)) { Write-Error "the study did not end in 13 minutes"; exit 1 }
          Get-Content "$out\study.log" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          exit [int](Get-Content $done).Trim()
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: study-processes-medium-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
