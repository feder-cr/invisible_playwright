# windows-flakes-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/windows-flakes**` branch.
# The networkidle round on /x0 left on its own page once (main e2e 43425218633, part 3): ours against stock Playwright Firefox, four at once, x5.
name: windows flakes hunt

on:
  push:
    branches: ['hunt/windows-flakes**']

permissions:
  contents: read

concurrency:
  group: windows-flakes-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: windows flakes hunt
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      matrix:
        os: [windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
          python scripts/ci_lab_geoip.py build
      - name: Flakes 1, 3 and 4 under four workers, ten times
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          mkdir -p evidence
          export INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF"
          for n in $(seq -w 1 10); do
            python -u -m pytest -o addopts= -p no:cacheprovider -m e2e -s -rA --tb=short --timeout 300 -n 4 --dist loadfile               tests/test_an_isolated_page_and_the_next_e2e.py               tests/test_the_association_is_ready_when_the_peerconnection_is_born_e2e.py               "tests/test_a_field_is_typed_after_a_pause.py::test_a_store_that_answers_the_focus_does_not_eat_the_text"               tests/test_a_page_that_moves_on_e2e.py > "evidence/run_$n.log" 2>&1
            echo "run $n: $(grep -aE '^=+ .*(passed|failed|error).* =+$' evidence/run_$n.log | head -1)"
          done
          {
            echo "## flakes 1, 3, 4"
            echo '```'
            grep -ahE "^(FAILED|ERROR) " evidence/run_*.log | cut -c1-220 | sort | uniq -c | sort -rn || true
            grep -ahoE "HUNT-(ISOLATED|STUN|TYPE).*" evidence/run_*.log | cut -c1-300 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-flakes-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
