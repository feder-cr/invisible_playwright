# windows-flakes-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/windows-flakes**` branch.
# The networkidle round on /x0 left on its own page once (main e2e 43425218633, part 3): ours against stock Playwright Firefox, four at once, x5.
name: windows flakes hunt

on:
  push:
    branches: ['hunt/windows-flakes**']

permissions:
  contents: read

concurrency:
  group: windows-flakes-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: flakes hunt ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
          python scripts/ci_lab_geoip.py build
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps firefox; else python -m playwright install firefox; fi
      - name: Typing per key, ours and stock, alone x20 and four at once x20
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          mkdir -p evidence
          for engine in ours stock; do
            for n in 1 2 3 4; do python -u scripts/hunt_typing.py $engine "$FF" >> "evidence/alone_$engine.log" 2>&1; done
            for c in 1 2 3 4; do python -u scripts/hunt_typing.py $engine "$FF" > "evidence/loaded_${engine}_$c.log" 2>&1 & done
            wait
          done
          {
            echo "## typing slip per key ($RUNNER_OS): ms after the plan at the last key, and page minus sent per key"
            echo '```'
            for set in alone_ours alone_stock loaded_ours loaded_stock; do
              cat evidence/${set}*.log | grep -a "^HUNT-TYPING" | sed 's/^HUNT-TYPING //' | python -c "
          import json,sys,statistics as s
          r=[json.loads(l) for l in sys.stdin]
          end=sorted(x['page_ms'][-1]-x['planned_ms'][-1] for x in r if len(x['page_ms'])==len(x['planned_ms']))
          snd=sorted(x['sent_ms'][-1]-x['planned_ms'][-1] for x in r if len(x['sent_ms'])==len(x['planned_ms']))
          per=[]
          [per.extend((p-q) for p,q in zip(x['page_ms'],x['sent_ms'])) for x in r]
          per.sort()
          q=lambda v,f: v[min(len(v)-1,int(len(v)*f))] if v else None
          print(sys.argv[1], 'runs', len(r), '| page slip at last key p50', q(end,.5), 'p95', q(end,.95), 'max', end[-1] if end else None,
                '| sent slip p50', q(snd,.5), 'max', snd[-1] if snd else None, '| page-sent per key p50', q(per,.5), 'p95', q(per,.95))
          " $set
            done
            grep -ahE "Traceback|Error" evidence/*.log | sort | uniq -c | head
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-flakes-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
