# windows-flakes-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/windows-flakes**` branch.
# The networkidle round on /x0 left on its own page once (main e2e 43425218633, part 3): ours against stock Playwright Firefox, four at once, x5, with the lifecycle, the pipe reader and the slow listeners inside our process stamped (ours only).
name: windows flakes hunt

on:
  push:
    branches: ['hunt/windows-flakes**']

permissions:
  contents: read

concurrency:
  group: windows-flakes-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: windows flakes hunt
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      matrix:
        os: [windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
          python scripts/ci_lab_geoip.py build
          python -m playwright install firefox
          python scripts/hunt_trace_lifecycle.py
          python scripts/hunt_trace_pipes.py
          python scripts/hunt_trace_inside.py
      - name: Ours and stock, four at once each, five times
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          mkdir -p evidence
          for n in 1 2 3 4 5; do
            for engine in ours; do
              for c in 1 2 3 4; do
                HUNT_LOCK_MAX="$PWD/evidence/lockmax_traced_${n}_$c.jsonl" HUNT_INSIDE_TRACE="$PWD/evidence/inside_${engine}_${n}_$c.jsonl" python -u scripts/hunt_netidle.py $engine "$FF" "$PWD/evidence/lc_${engine}_${n}_$c.jsonl" "$PWD/evidence/pipe_${engine}_${n}_$c.txt" > "evidence/${engine}_${n}_$c.log" 2>&1 &
              done
              wait
            done
            echo "round $n done"
          done
          # the typing per key under the same stamps: is the slip of the keys the same wait (ours only, four at once x5)
          for n in 1 2 3 4 5; do
            for c in 1 2 3 4; do
              HUNT_LOCK_MAX="$PWD/evidence/lockmax_typing_${n}_$c.jsonl" HUNT_INSIDE_TRACE="$PWD/evidence/inside_typing_${n}_$c.jsonl" python -u scripts/hunt_typing.py ours "$FF" > "evidence/typing_${n}_$c.log" 2>&1 &
            done
            wait
          done
          # the control: no line per event, only the longest hold of the lifecycle's lock per holder, written at exit
          for n in 1 2 3 4 5; do
            for c in 1 2 3 4; do
              HUNT_LOCK_MAX="$PWD/evidence/lockmax_control_${n}_$c.jsonl" python -u scripts/hunt_netidle.py ours "$FF" > "evidence/control_${n}_$c.log" 2>&1 &
            done
            wait
          done
          {
            echo "## networkidle rows: engine, landed at return, count"
            echo '```'
            cat evidence/*.log | grep -a "^HUNT-ROW" | sed 's/^HUNT-ROW //' | python -c "import sys,json,collections; c=collections.Counter(); [c.update([(r['engine'], r['path'], r['landed_at_return'], r['error'] is not None)]) for r in map(json.loads, sys.stdin)]; [print(k, v) for k, v in sorted(c.items())]"
            echo "## rows not on /landed at return, with the /landed request time"
            cat evidence/*.log | grep -a "^HUNT-ROW" | grep -a '"landed_at_return": false' | cut -c1-260
            for kind in traced typing control; do
              echo "## longest hold of the lifecycle lock per holder ($kind)"
              cat evidence/lockmax_${kind}_*.jsonl | python -c "
          import json,sys,collections
          m=collections.defaultdict(list); n=collections.Counter()
          for l in sys.stdin:
              r=json.loads(l); m[r['holder']].append(r['max_ms']); n[r['holder']]+=r['count']
          for k,v in sorted(m.items(), key=lambda kv:-max(kv[1]))[:12]:
              v.sort(); print('%-70s max %5d  p95-of-runs %5d  holds %d' % (k, v[-1], v[min(len(v)-1,int(len(v)*.95))], n[k]))
          "
            done
            echo "## slow listeners and announces inside our process (traced passes): count, p95, max per name"
            cat evidence/inside_*.jsonl | python -c "
          import json,sys,collections
          m=collections.defaultdict(list)
          for l in sys.stdin:
              r=json.loads(l); m[(r['kind'], r.get('fn'))].append(r['ms'])
          for k,v in sorted(m.items(), key=lambda kv:-sum(kv[1]))[:15]:
              v.sort(); print('%-34s %-60s n %4d p95 %5d max %5d sum %6d' % (k[0], str(k[1])[:60], len(v), v[min(len(v)-1,int(len(v)*.95))], v[-1], sum(v)))
          "
            echo "## typing slip (ours, four at once, traced)"
            cat evidence/typing_*.log | grep -a "^HUNT-TYPING" | sed 's/^HUNT-TYPING //' | python -c "
          import json,sys
          r=[json.loads(l) for l in sys.stdin]
          e=sorted(x['sent_ms'][-1]-x['planned_ms'][-1] for x in r if len(x['sent_ms'])==len(x['planned_ms']))
          print('runs', len(r), 'sent slip at last key p50', e[len(e)//2] if e else None, 'max', e[-1] if e else None)
          "
            echo "## control rows not on /landed"
            cat evidence/control_*.log | grep -a "^HUNT-ROW" | grep -ac '"landed_at_return": false'
            grep -ahE "Traceback|Error" evidence/*.log | sort | uniq -c | head -20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-flakes-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
