name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run of this workflow per branch at a time. A newer push cancels the older
# in-flight run as a whole, cleanly, instead of leaving its queued jobs to be
# cancelled one by one - which left the run marked failed even though nothing
# had actually failed. Keyed by workflow + ref so tests and e2e never cancel
# each other; only an older run of THIS workflow on the same branch is replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate was written FOR this repository on 2026-08-27, after 549 lines of
  # Italian shipped here in one subsystem and 852 more were found in 33 files
  # that were already public. It has been wired nowhere ever since: not into
  # tests.yml, not into the pre-push hook, whose steps are pytest, pin, names,
  # internals and publish. Both sibling packages copied the script AND the CI
  # step; this one kept only the script, so the one repository the rule exists
  # for is the one that never checked. Measured 2026-09-03, the first time
  # anybody ran it here: four files, red.
  #
  # Its own job, and deliberately NOT behind core-on-index. Reading files needs
  # no install, and hanging a language check off the availability of a package on
  # an index would silently skip it during exactly the window when releases are
  # being made.
  english:
    name: the repository is English
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check the prose
        # --selftest first: a language gate that has only ever printed "clean" is
        # the same non-gate as any other, and this one can go blind from a single
        # edit to its word list.
        run: |
          python scripts/check_english_only.py --selftest
          python scripts/check_english_only.py

  # `pip install -e ".[dev]"` below resolves `invisible-core==N.M.0` from the
  # package index. The core is published BEFORE this package, so between the
  # first push of this repo and that upload there is a window in which no
  # install here can succeed. This gate answers "is it on the index?" and the
  # unit job depends on the answer: during the window that job is SKIPPED (grey
  # in the checks list, with the reason written into the run summary), never
  # faked green; once the core is published it runs exactly as before. Full
  # reasoning, including why `|| true`, `--no-deps` and a git fallback were all
  # rejected, is in .github/workflows/core-on-index.yml.
  core-on-index:
    uses: ./.github/workflows/core-on-index.yml

  unit:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    needs: core-on-index
    if: needs.core-on-index.outputs.available == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every version `requires-python = ">=3.11"` promises. Two of them were
        # untested until 2026-08-01, and the user who opened issue #51 was on
        # 3.14. test_marker_vocabulary.py compares this list to the floor.
        python: ["3.11", "3.12", "3.13", "3.14"]
        # Windows runners are the scarce, 2x-cost, slow-to-schedule ones, and a
        # burst of pushes queues them for a long time. Run the FULL Python range
        # on ubuntu (cheap, fast) and cover Windows on 3.12 only - this is a
        # pure-Python package, the OS-specific surface is tiny. The python LIST
        # above stays complete so test_marker_vocabulary still sees every version.
        exclude:
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.13" }
          - { os: windows-latest, python: "3.14" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: arm the pre-push gates
        # A fresh clone has no core.hooksPath, and the suite says so - the
        # reminder moved into `invisible_core.testing` on 2026-07-28 and all
        # three repos that existed then made the assertion (two now, since
        # invisible_firefox was deleted on 2026-08-18), but only the core's CI
        # had this step, so both consumers went red on it. Do here what a
        # developer does once. It also means install_hooks.py is exercised on
        # every runner instead of only on the one machine that ever ran it by
        # hand.
        run: python scripts/install_hooks.py

      - name: undefined names and duplicate definitions
        # F821 (undefined name) and F811 (redefinition) only. Not a style pass:
        # these two are the rules that catch a name that cannot resolve, which
        # `from __future__ import annotations` hides in an annotation and which
        # a suite only finds if it happens to execute that line. Both bit on
        # 2026-07-28 - a `throwaway_venv` used and imported nowhere took a
        # user-install job red at RUNTIME, and six annotations named a type that
        # was defined in no module at all.
        #
        # Zero violations in all three repos when this was added, so it is a
        # gate rather than a cleanup backlog. Keep it that way.
        run: |
          python -m ruff check --select F821,F811,F601 --no-cache --output-format concise .

      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail   # or tee would swallow pytest's exit code
          pytest tests/ -v --tb=short -rs | tee tests-report.txt

      # This repo has the largest suite of the three and was the only one with
      # no floor. pytest's exit code cannot distinguish "everything passed"
      # from "the marker expression deselected everything", and `addopts`
      # already filters on two markers - one more, or a typo in one, silently
      # turns 726 tests into 0 and reports success.
      - name: Refuse a run in which the suite deselected itself
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("tests-report.txt").read_text(encoding="utf-8", errors="ignore")
          m = re.search(r"(\d+) passed", text)
          passed = int(m.group(1)) if m else 0
          # FLOOR, not a target. It exists because a mis-wired selection runs
          # almost nothing and still exits 0 - the exit code cannot see it.
          #
          # Was 600 until 2026-07-27, when 322 tests MOVED to invisible_core:
          # they covered core modules and reached them through this package's
          # four-line back-compat shims, so six real breaks in core code were
          # surviving the core's own suite. Nothing shrank; the tests are in the
          # package they test. This suite runs ~420 now.
          #
          # Keep it a little under the real count. It is a tripwire for "the
          # selection collapsed", not an assertion about how many tests exist.
          if passed < 380:
              print(f"only {passed} test(s) ran (expected 380+) - the selection "
                    f"dropped most of the suite and the exit code cannot see it",
                    file=sys.stderr)
              sys.exit(1)
          print(f"{passed} tests ran")
          PY

  # ONE SINGLE CONTEXT FOR BRANCH PROTECTION. Measured 2026-08-13: this
  # repo's protection required `pytest (windows-latest, py3.11)`, which the
  # matrix explicitly EXCLUDES a few lines up - a context no job can ever
  # produce, so a protection that could never be satisfied. With
  # `enforce_admins` set to false every push went through anyway and nobody
  # noticed. Same shape in the core and in the manager.
  #
  # A list of matrix names drifts every time the matrix changes, and that is
  # exactly how it got here. This job depends on the whole matrix and its
  # name never changes.
  #
  # SKIPPED IS NOT FAILED, and that is the part specific to this repo. `unit`
  # is skipped on purpose when `core-on-index` says the pin is not yet on the
  # index: during that window no install can succeed, and the workflow chose
  # to SKIP instead of faking green. A gate that required `success` would
  # turn that choice into a red and push toward dropping the protection on
  # release day of all days. So it refuses on `failure` and `cancelled`,
  # never on `skipped`.
  gate:
    needs: [core-on-index, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: refuse unless nothing failed
        run: |
          echo "core-on-index: ${{ needs.core-on-index.result }}"
          echo "unit:          ${{ needs.unit.result }}"
          case "${{ needs.unit.result }}" in
            failure|cancelled) echo "the suite did not pass"; exit 1 ;;
          esac
          case "${{ needs.core-on-index.result }}" in
            failure|cancelled) echo "the index check did not run"; exit 1 ;;
          esac
          echo "ok"
