# ─────────────────────────────────────────────────────────────────────────────
# e2e-hunt.yml - runs the e2e suite in a LOOP until it catches a hang.
#
# Why it exists. The e2e job hangs in 12% of runs (4 out of 33 between
# 2026-08-01 and 08-13), and the 40-minute ceiling kills the job. At 12% a
# green run proves nothing, and it takes ~18 runs to have a 90% probability
# of seeing one: waiting for it to happen on its own on a PR means waiting
# days and burning someone else's time every time.
#
# And why HERE and not locally, for TWO different reasons depending on the
# `os` input.
#
#   ubuntu-24.04 - the job hang lived there. CLOSED on 2026-08-13 with 36
#   runs (two hunts of 18): zero hangs, zero retries. Stays as a
#   non-regression check.
#
#   windows-latest - a different question, still open: on the dev machine
#   interaction tests produce retries (41 out of 17 runs) and on Linux not
#   even one in 36. But that machine was not idle - whoever was measuring
#   was running on it, and later the owner came back to it - so the
#   comparison is CONFUSED between platform and contention. A dedicated
#   Windows runner separates the two without asking anyone to stay off it
#   for six hours.
#
# SECOND HUNT, `hunt: release-triple`. Three kinds of jobs in parallel on
# ubuntu-24.04, against the code of the ref it is dispatched on (a release
# branch plus this file), for failures that show up once in many runs:
#
#   suite    the whole e2e suite exactly as e2e.yml runs it (same command, both
#            passes, four workers), K jobs of R consecutive runs, every run
#            recorded, none stopping at the first red. One more leg runs the
#            same command with the processes limited to ONE CPU (`taskset -c
#            0`) and is reported on its own line, so its reds are not mixed
#            into the rate of the ordinary legs. `suite-tally` adds it all up.
#   webgl    tests/test_fingerprint_consistency.py::test_webgl_getParameter_
#            deterministic, rounds of N pytest processes started together (four
#            browsers ask for a WebGL context at once, as in the parallel suite).
#   launch   scripts/hunt_launch_close.py: launch, open a page, close, many
#            times, keeping the engine's own output of every cycle.
#
# `which` chooses the hunts of one dispatch: all, suite, webgl, launch or a
# comma list (`webgl,launch`). The result of the run is red ONLY when a job
# broke (install, fetch, a script error, a run with no verdict). A failure the
# hunt caught is reported in the summaries and the job stays green.
#
# Doesn't start on its own: `workflow_dispatch` only. It's not a gate, it's
# an investigation tool, and it must not be added to the required contexts.
# ─────────────────────────────────────────────────────────────────────────────
name: e2e hunt

on:
  workflow_dispatch:
    inputs:
      hunt:
        description: "suite-loop = the loop below until it catches a hang (one runner). release-triple = the suite x N, webgl x 52 and launch-close x 300 hunts in parallel jobs, on ubuntu-24.04."
        required: false
        default: "suite-loop"
        type: choice
        options:
          - suite-loop
          - release-triple
      which:
        description: "release-triple only: which hunts run. all | suite | webgl | launch | a comma list such as webgl,launch"
        required: false
        default: "all"
      suite_jobs:
        description: "release-triple: parallel jobs of the suite hunt"
        required: false
        default: "6"
      suite_runs_each:
        description: "release-triple: consecutive full runs in each of those jobs (about 18-20 minutes each)"
        required: false
        default: "5"
      suite_onecpu_runs:
        description: "release-triple: runs of the extra suite job limited to ONE CPU (taskset -c 0), reported apart; 0 = no such job"
        required: false
        default: "2"
      webgl_rounds:
        description: "release-triple: rounds of the webgl hunt"
        required: false
        default: "13"
      webgl_procs:
        description: "release-triple: pytest processes started together in each round (13 x 4 = 52 runs)"
        required: false
        default: "4"
      launch_jobs:
        description: "release-triple: parallel jobs of the launch-close hunt"
        required: false
        default: "3"
      launch_cycles_each:
        description: "release-triple: launch-close cycles in each of those jobs (3 x 100 = 300)"
        required: false
        default: "100"
      runs:
        description: "How many runs at most (at 12% it takes ~18 for a 90% chance)"
        required: false
        default: "18"
      os:
        description: "Where to hunt. windows-latest answers a DIFFERENT question: are the interaction retries seen on the dev machine the product or contention?"
        required: false
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-24.04
          - windows-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token.
# Anonymous requests share a 60-an-hour limit per runner address and are the
# ones GitHub drops first when it is degraded (2026-11-08: timeouts for
# unauthenticated users failed the gates three times). user-install.yml stays
# anonymous on purpose: it is the user's path.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: hunt (${{ inputs.os }})
    if: inputs.hunt == 'suite-loop'
    runs-on: ${{ inputs.os }}
    # 18 runs of ~6 minutes plus install time. Deliberately generous: the
    # ceiling here must NEVER be the thing that stops the hunt, or we're back
    # to a killed job that explains nothing, which is the original defect.
    timeout-minutes: 300
    # On Windows GitHub runs `run:` blocks with POWERSHELL, not bash, and the
    # first launch on windows-latest died in 5 minutes with a ParserError on
    # the line `if [ "$RUNNER_OS" = "Linux" ]`. The block had been run before
    # shipping it, as the rule requires - but in bash, on the writer's own
    # machine, i.e. with an interpreter different from the target's.
    # Running the block is not enough: it has to run with the runner's SHELL.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ pinned Playwright)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      # Linux only: on Windows the browser launches on the runner's desktop,
      # and `firefox-launch-matrix.yml` has shown for months that it really
      # starts there.
      - name: System deps (xvfb + Firefox runtime libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"

      - name: Loop until it catches one
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_TEST_WATCHDOG_FILE: evidence/e2e-watchdog.log
        run: |
          set -u
          runs="${{ inputs.runs }}"
          mkdir -p evidence/runs
          # `evidence/` inside the workspace, not RUNNER_TEMP: on Windows that
          # variable contains backslashes and does not cross bash reliably.
          # xvfb only where it exists; on Windows the browser goes to the
          # runner's desktop.
          if [ "$RUNNER_OS" = "Linux" ]; then PRE="xvfb-run -a"; else PRE=""; fi
          captured=0
          for n in $(seq 1 "$runs"); do
            log="evidence/runs/run_$(printf '%02d' "$n").log"
            t0=$(date +%s)
            set +e
            $PRE python -u scripts/run_e2e.py "$FF" > "$log" 2>&1
            code=$?
            set -e
            dur=$(( $(date +%s) - t0 ))
            # A hang is no longer a killed job now: the per-test deadline
            # turns it into a failure, and the banner names it.
            if grep -aq "Timeout" "$log" && grep -aq "Stack of" "$log"; then
              echo "::error::run $n: HANG CAUGHT after ${dur}s"
              echo "--- the last test that spoke ---"
              grep -aE "::.*(PASSED|SKIPPED|FAILED)" "$log" | tail -3
              echo "--- the stack ---"
              sed -n '/Timeout/,$p' "$log" | head -60
              captured=1
              break
            fi
            echo "run $n/$runs: exit=$code, ${dur}s"
          done
          if [ "$captured" = "0" ]; then
            echo "::warning::$runs runs, no hang caught."
            echo "If the rate here is the same 12%, the probability of this"
            echo "outcome is $(python -c "print(round(100*0.88**$runs))")%, so this is not proof"
            echo "the defect is not there: it is a measurement of the rate with this sample."
          fi
          # The step fails ONLY if it caught one: that way red means "found",
          # not "broken", and red is what you go read.
          exit "$captured"

      - name: Upload all the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-hunt-${{ inputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/runs
            evidence/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # hunt = release-triple. Everything below is skipped for `suite-loop`.
  # ───────────────────────────────────────────────────────────────────────────

  # Decides which hunts run and how big their matrices are (the pure part is
  # scripts/hunt_report.py `plan`, tested in tests/test_e2e_hunt_triple.py).
  # A `which` that names no hunt FAILS here, before any runner is spent.
  plan:
    name: plan
    if: inputs.hunt == 'release-triple'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      webgl: ${{ steps.plan.outputs.webgl }}
      launch: ${{ steps.plan.outputs.launch }}
      suite_matrix: ${{ steps.plan.outputs.suite_matrix }}
      launch_matrix: ${{ steps.plan.outputs.launch_matrix }}
      webgl_timeout: ${{ steps.plan.outputs.webgl_timeout }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - name: Plan
        id: plan
        env:
          WHICH: ${{ inputs.which }}
          SUITE_JOBS: ${{ inputs.suite_jobs }}
          SUITE_RUNS_EACH: ${{ inputs.suite_runs_each }}
          ONECPU_RUNS: ${{ inputs.suite_onecpu_runs }}
          WEBGL_ROUNDS: ${{ inputs.webgl_rounds }}
          WEBGL_PROCS: ${{ inputs.webgl_procs }}
          LAUNCH_JOBS: ${{ inputs.launch_jobs }}
          LAUNCH_CYCLES_EACH: ${{ inputs.launch_cycles_each }}
        run: |
          python3 scripts/hunt_report.py plan --hunt release-triple --which "$WHICH" \
            --suite-jobs "$SUITE_JOBS" --suite-runs-each "$SUITE_RUNS_EACH" \
            --onecpu-runs "$ONECPU_RUNS" --webgl-rounds "$WEBGL_ROUNDS" \
            --webgl-procs "$WEBGL_PROCS" --launch-jobs "$LAUNCH_JOBS" \
            --launch-cycles-each "$LAUNCH_CYCLES_EACH"

  # A. The whole suite, as e2e.yml runs it, again and again. Ordinary legs run
  # on every CPU of the runner; the `1-CPU` leg runs the same command under
  # `taskset -c 0` (the CPU affinity is inherited by xvfb, the four xdist
  # workers and every browser, and Firefox reads it as its CPU count). Every
  # run is recorded; nothing stops at the first red.
  suite:
    name: ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.suite == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suite_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      # Only the 1-CPU leg: the affinity really is one CPU, and xdist still
      # starts its four workers under it (collection runs on the workers).
      # A failure here is a broken job, not a caught failure.
      - name: Preflight of the 1-CPU leg
        if: matrix.taskset != ''
        run: |
          taskset -c 0 python -c "import os; print('affinity:', sorted(os.sched_getaffinity(0)))"
          taskset -c 0 xvfb-run -a python -m pytest -o addopts= -m e2e -n 4 --dist loadfile \
            --collect-only -q tests/test_fingerprint_consistency.py | tail -5
      - name: The suite, ${{ matrix.runs }} full runs, every run recorded
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_TEST_WATCHDOG_FILE: evidence/e2e-watchdog.log
          RUNS: ${{ matrix.runs }}
          LABEL: ${{ matrix.label }}
          CPUS: ${{ matrix.cpus }}
          PRE: ${{ matrix.taskset }}
        run: |
          set -u
          mkdir -p evidence/runs
          for n in $(seq 1 "$RUNS"); do
            nn=$(printf '%02d' "$n")
            log="evidence/runs/run_${nn}.log"
            t0=$(date +%s)
            set +e
            # The command of e2e.yml, nothing added; $PRE is empty or `taskset -c 0`.
            $PRE xvfb-run -a python -u scripts/run_e2e.py "$FF" > "$log" 2>&1
            code=$?
            set -e
            dur=$(( $(date +%s) - t0 ))
            python scripts/hunt_report.py run-line --log "$log" --out "evidence/runs/run_${nn}.json" \
              --run "$n" --of "$RUNS" --label "$LABEL" --cpus "$CPUS" --exit "$code" --seconds "$dur"
          done
      # Red here = a run without a verdict (broken), never a failed test.
      - name: Summary of this job
        if: always()
        run: python scripts/hunt_report.py suite-summary evidence/runs
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt-suite-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/runs
            evidence/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14

  # What all the legs of A found, added up: the ordinary legs together (the
  # rate), the 1-CPU leg on its own line.
  suite-tally:
    name: suite-tally
    needs: [plan, suite]
    if: always() && needs.plan.outputs.suite == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Reading the artifacts of this run needs `actions: read`; nothing else is widened.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - name: Download the evidence of every leg
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p all
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --pattern "hunt-suite-*-${ATTEMPT}" -D all
          ls -R all | head -60
      - name: Tally
        run: python3 scripts/hunt_report.py suite-tally all

  # B. One test, under contention: `webgl_procs` pytest processes started
  # together, `webgl_rounds` times, one Xvfb for all of them (as the parallel
  # suite has). Each process has its own log; the assertion message, which says
  # why a context is null, is kept whole.
  webgl:
    name: webgl ${{ inputs.webgl_rounds }} rounds of ${{ inputs.webgl_procs }}
    needs: plan
    if: needs.plan.outputs.webgl == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.webgl_timeout) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The webgl test, rounds of processes started together
        env:
          PYTHONUNBUFFERED: "1"
          ROUNDS: ${{ inputs.webgl_rounds }}
          PROCS: ${{ inputs.webgl_procs }}
        run: |
          set -u
          test_id="tests/test_fingerprint_consistency.py::test_webgl_getParameter_deterministic"
          mkdir -p evidence/webgl
          export INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF"
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > evidence/webgl/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if [ -e /tmp/.X11-unix/X99 ]; then break; fi
            sleep 0.2
          done
          export DISPLAY=:99
          for r in $(seq 1 "$ROUNDS"); do
            rr=$(printf '%02d' "$r")
            pids=()
            for p in $(seq 1 "$PROCS"); do
              base="evidence/webgl/round_${rr}_proc_${p}"
              (
                set +e
                python -u -m pytest "$test_id" -o addopts= -p no:cacheprovider \
                  --timeout 420 --timeout-method thread -v --tb=short \
                  --basetemp "${RUNNER_TEMP}/webgl_${rr}_${p}" > "${base}.log" 2>&1
                echo $? > "${base}.exit"
              ) &
              pids+=($!)
            done
            wait "${pids[@]}"
            for p in $(seq 1 "$PROCS"); do
              base="evidence/webgl/round_${rr}_proc_${p}"
              python scripts/hunt_report.py webgl-run --log "${base}.log" --out "${base}.json" \
                --round "$r" --proc "$p" --exit "$(cat "${base}.exit")" --test "$test_id"
            done
          done
      # Red here = a process without a verdict (skipped, killed), never a failed test.
      - name: Tally
        if: always()
        run: python scripts/hunt_report.py webgl-tally evidence/webgl
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt-webgl-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/webgl
          if-no-files-found: warn
          retention-days: 14

  # C. launch, open one page, close; the engine's output kept for each cycle.
  launch-close:
    name: launch-close #${{ matrix.job }} (${{ matrix.cycles }} cycles)
    needs: plan
    if: needs.plan.outputs.launch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.launch_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      # The script ends 0 whatever the cycles did (caught); it ends red only if
      # it could not run (no binary, no psutil).
      - name: Launch and close, ${{ matrix.cycles }} cycles
        env:
          PYTHONUNBUFFERED: "1"
          CYCLES: ${{ matrix.cycles }}
          START: ${{ matrix.start }}
          JOB: ${{ matrix.job }}
        run: |
          xvfb-run -a python -u scripts/hunt_launch_close.py --binary "$FF" \
            --cycles "$CYCLES" --start "$START" --job "#$JOB" --out evidence/launch
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt-launch-${{ matrix.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/launch
          if-no-files-found: warn
          retention-days: 14
