name: bg-traffic hunt (what the browsers contact by themselves behind a proxy)

# A hunt, not a gate. Behind a proxy our browser has been seen contacting hosts that the Firefox of Playwright does not (the launch counter, remote settings, telemetry,
# location, ads, portal detection). The comparison that decides is with the RETAIL Firefox: what OURS does and the retail does not is a defect; what the retail does and
# ours does not is a difference to read. Four arms, each with a proxy of its own that records every CONNECT and request (host, port, bytes, second) and never reaches past loopback:
#   ours       published firefox-63 and invisible-core 63.67.0 (the wrapper of this checkout), driven by Juggler
#   retail     the official Firefox 159.0 (downloaded from Mozilla in this job), a new profile, started as a user starts it
#   retail-gd  the same, driven by geckodriver / Marionette
#   stock      the Firefox of Playwright
# One local page loaded, then 120 s standing still; 5 runs per arm; behind an HTTP proxy and behind SOCKS5. It starts on a push that touches this file or its scripts.

on:
  push:
    paths:
      - '.github/workflows/bg-traffic-hunt.yml'
      - 'scripts/bg_traffic.py'
      - 'scripts/bg_traffic_run.sh'
      - 'scripts/bg_traffic_table.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  RETAIL_VERSION: '159.0'
  GECKODRIVER_VERSION: 'v0.36.0'

jobs:
  hunt:
    name: bg-traffic (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the core from the index, the wrapper of this checkout, the stock Playwright Firefox and the lab's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)" "invisible-core==63.67.0" "h2>=4,<5" "cryptography>=41" selenium
          INVISIBLE_CORE_PIN=allow python -m pip install --no-deps -e .
          python -m playwright install-deps firefox
          python -m playwright install firefox
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -c "from importlib.metadata import version; print('core', version('invisible-core'), 'wrapper', version('invisible-playwright'), 'playwright', version('playwright'))"
      - name: The engine as published (the way a user gets it)
        run: |
          export INVISIBLE_CORE_PIN=allow INVISIBLE_CORE_AUTOFIX=off
          python -m invisible_playwright fetch | tee fetch.out
          LAST="$(tail -1 fetch.out)"
          if [ -d "$LAST" ]; then EXE="$(find "$LAST" -maxdepth 3 -name firefox -type f | head -1)"; else EXE="$LAST"; fi
          test -x "$EXE" || { echo "no engine at: $LAST"; exit 1; }
          echo "OURS_EXE=$EXE" >> "$GITHUB_ENV"
          "$EXE" --version || true
      - name: The retail Firefox and geckodriver (downloaded here, nothing of it in the repository)
        run: |
          mkdir -p retail bin
          curl -fsSL --retry 3 "https://download-installer.cdn.mozilla.net/pub/firefox/releases/${RETAIL_VERSION}/linux-x86_64/en-US/firefox-${RETAIL_VERSION}.tar.xz" | tar -xJ -C retail
          curl -fsSL --retry 3 "https://github.com/mozilla/geckodriver/releases/download/${GECKODRIVER_VERSION}/geckodriver-${GECKODRIVER_VERSION}-linux64.tar.gz" | tar -xz -C bin
          echo "RETAIL_EXE=$PWD/retail/firefox/firefox" >> "$GITHUB_ENV"
          echo "$PWD/bin" >> "$GITHUB_PATH"
          retail/firefox/firefox --version
      - name: The four arms, 5 runs each, behind an HTTP proxy and behind SOCKS5 (120 s standing still)
        env:
          INVISIBLE_CORE_PIN: allow
          INVISIBLE_CORE_AUTOFIX: 'off'
          MOZ_CRASHREPORTER_DISABLE: '1'
        run: bash scripts/bg_traffic_run.sh 5 120
      - name: The table
        if: always()
        run: |
          { echo '## background traffic'; echo '```'; cat bgt/table.txt 2>/dev/null | cut -c1-200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload what was recorded
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bg-traffic-${{ github.run_id }}
          path: bgt
          if-no-files-found: warn
          retention-days: 30
