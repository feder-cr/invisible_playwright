# windows-two-tests-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/windows-two-tests**` branch.
# The two Windows reds of PR #486 run 43383366904 judged on the time (transport late element, cross-origin count), on their fix, x20.
name: windows two tests hunt

on:
  push:
    branches: ['hunt/windows-two-tests**']

permissions:
  contents: read

concurrency:
  group: windows-two-tests-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: windows two tests x20
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      matrix:
        os: [windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
          python scripts/ci_lab_geoip.py build
      - name: The two tests twenty times
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_TEST_WATCHDOG_FILE: ${{ github.workspace }}/evidence/e2e-watchdog.log
        run: |
          set +e
          mkdir -p evidence
          export INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF"
          for n in $(seq -w 1 40); do
            export INVPW_HUNT_POPUP_TRACE="$PWD/evidence/trace_$n.jsonl"
            python -u scripts/run_e2e.py "$FF" tests/test_juggler_transport.py::test_the_public_API_WAITS_for_an_element_that_arrives_late tests/test_cross_origin_iframe.py::test_cross_origin_iframe_frame_locator_resolves_button -rA --tb=short --timeout 200 > "evidence/run_$n.log" 2>&1
            echo "run $n: $(grep -aE '^=+ .*(passed|failed|error).* =+$' evidence/run_$n.log | head -1)"
          done
          {
            echo "## the two tests x20 on Windows"
            echo '```'
            grep -ahE "^(FAILED|ERROR) " evidence/run_*.log | cut -c1-200 | sort | uniq -c | sort -rn || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-two-tests-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
