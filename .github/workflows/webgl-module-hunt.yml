name: webgl-module-hunt (the module of the WebGL determinism test, repeated)

# A hunt, not a gate. test_webgl_getParameter_deterministic gave `getContext('webgl') == null` once in a run of the whole suite on a loaded runner and never alone
# (about 1500 isolated runs here and on GitHub). In the suite the module tests/test_fingerprint_consistency.py runs whole on ONE xdist worker, in file order, on a
# browser the module shares (about 50 tests before the WebGL one). So this repeats THAT: the whole module, in order, in PROCS processes at once, ROUNDS times each,
# beside other WebGL/canvas modules running in the same job (the load the suite puts on the machine). Every round that fails, or says 'gl null', keeps its log and
# the engine's own log of the WebGL/GL channels; the reason the browser gives (webglcontextcreationerror.statusMessage, now in the assertion) is collected.
# It starts on a push that touches this file.

on:
  push:
    paths:
      - '.github/workflows/webgl-module-hunt.yml'
  workflow_dispatch:
    inputs:
      rounds:
        description: 'rounds per process'
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  PROCS: '4'
  NOISE: '2'
  ROUNDS: ${{ inputs.rounds || '20' }}

jobs:
  hunt:
    name: webgl module x${{ inputs.rounds || '20' }} in 4 processes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The module, repeated in PROCS processes beside the noise
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p evidence
          export INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF" MOZ_CRASHREPORTER_DISABLE=1
          # the noise: other WebGL / canvas modules, in a loop, in NOISE processes, until the hunt is done
          rm -f evidence/stop
          for n in $(seq 1 "$NOISE"); do
            (
              while [ ! -e evidence/stop ]; do
                for f in tests/test_webgl_draws_on_the_engine_s_own_gl_e2e.py tests/test_webgl_blending_rounds_once_e2e.py \
                         tests/test_webgl_mediump_is_full_precision_e2e.py tests/test_canvas_render_stealth.py; do
                  [ -e evidence/stop ] && break
                  xvfb-run -a python -m pytest "$f" -m e2e -q -p no:cacheprovider > /dev/null 2>&1 || true
                done
              done
            ) &
          done
          for p in $(seq 1 "$PROCS"); do
            (
              for r in $(seq 1 "$ROUNDS"); do
                base="evidence/module_r$(printf %02d "$r")_p${p}"
                MOZ_LOG="WebGL:5,GLContext:5,gfx:4,sync" MOZ_LOG_FILE="${base}.moz" \
                  xvfb-run -a python -m pytest tests/test_fingerprint_consistency.py -m e2e -q -p no:cacheprovider -rA > "${base}.log" 2>&1
                code=$?
                echo "round $r proc $p exit $code" >> evidence/rounds.txt
                if [ "$code" = 0 ] && ! grep -aq "gl null" "${base}.log"; then
                  rm -f "${base}.log" "${base}".moz*
                fi
              done
            ) &
          done
          # wait for the PROCS repeaters only (the noise loops run until the stop file)
          while [ "$(grep -c . evidence/rounds.txt 2>/dev/null || echo 0)" -lt $((PROCS * ROUNDS)) ]; do sleep 5; done
          touch evidence/stop
          wait || true
      - name: What was seen
        if: always()
        run: |
          total=$(grep -c . evidence/rounds.txt || true)
          bad=$(grep -vc "exit 0" evidence/rounds.txt || true)
          echo "rounds: ${total}, not green: ${bad}"
          grep -v "exit 0" evidence/rounds.txt || true
          echo "--- reasons the browser gave (webglcontextcreationerror.statusMessage) ---"
          grep -ah "errors=\|WebGL creation failed\|gl null\|FEATURE_FAILURE" evidence/*.log 2>/dev/null | sort | uniq -c | sort -rn | head -20 || true
          echo "--- tests that failed ---"
          grep -ah "^FAILED" evidence/*.log 2>/dev/null | sort | uniq -c | sort -rn | head -10 || true
      - name: Upload the evidence (failed rounds only, and the round list)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webgl-module-hunt-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
