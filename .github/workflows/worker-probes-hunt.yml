# worker-probes-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/worker-probes**` branch.
# Which kind of Web Worker answers (classic URL, blob, data, module, nested, shared), ours against stock Playwright Firefox, direct and behind a proxy, x5.
name: worker probes hunt

on:
  push:
    branches: ['hunt/worker-probes**']

permissions:
  contents: read

concurrency:
  group: worker-probes-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: worker probes hunt ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
          python scripts/ci_lab_geoip.py build
          python -m pip list 2>/dev/null | grep -iE "^(invisible|playwright)" | tee evidence_versions.txt
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps firefox; else python -m playwright install firefox; fi
      - name: Worker probes, ours and stock, direct and behind a proxy, x5
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          mkdir -p evidence; cp evidence_versions.txt evidence/versions.txt 2>/dev/null
          for cfg in direct socks_auth socks http; do
            timeout 1500 python -u scripts/hunt_workers.py ours $cfg "$FF" > "evidence/ours_$cfg.log" 2>&1
            echo "ours $cfg exit $?"
          done
          for cfg in direct socks http; do
            timeout 1500 python -u scripts/hunt_workers.py stock $cfg > "evidence/stock_$cfg.log" 2>&1
            echo "stock $cfg exit $?"
          done
          {
            echo "## worker probes ($RUNNER_OS): probe x engine/config, 5 rounds each"
            echo '```'
            python scripts/hunt_workers.py table evidence/*.log
            grep -ahE "Traceback|Error" evidence/*.log | grep -av "^HUNT-WORKER" | sort | uniq -c | head
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Raw lines that are not ok
        if: always()
        run: |
          grep -ahv '"status": "ok"' evidence/*.log | cut -c1-900 | head -150
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-probes-${{ matrix.os }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
