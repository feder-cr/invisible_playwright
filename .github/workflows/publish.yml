name: publish

# Publishing invisible-playwright from a tag, with no long-lived credential anywhere.
#
# WHAT REPLACED WHAT. This package was uploaded by hand, from one machine, with a
# long-lived PyPI token sitting on it. Two things follow from that and neither is
# hypothetical: the token is a standing credential whose blast radius is the whole
# project, and a hand-run twine has no gate in front of it - the ordering rules
# live in a person's memory.
#
# The credential here is the `pypi` GitHub Environment's OIDC trust relationship,
# minted per run and valid for minutes. Only the `upload` job names that
# environment, and `upload` declares `needs: gate`, so a red gate means the only
# job that can authenticate never starts. The ordering is a dependency, not a
# convention.
#
# BEFORE THE FIRST RUN, on PyPI: Manage project -> Publishing -> add a GitHub
# publisher with owner `feder-cr`, repository `invisible_playwright`, workflow
# `publish.yml`, environment `pypi`. Until that exists the upload fails with
# `invalid-publisher`, which is the correct failure: nothing has said this
# workflow may speak for this project. Revoke the long-lived token AFTER the
# first successful OIDC publish, not before.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Asked of the INDEX, first, because a tag can legitimately name a version that
  # is already published: a tag backfilled for a hand-published release, a tag
  # re-pushed, a re-run of this workflow. In all of those there is nothing to do
  # and nothing wrong, and reaching twine would fail on a filename the index has
  # already served - a red run for a situation that is fine.
  already-published:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
      version: ${{ steps.probe.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        shell: bash
        run: |
          VERSION="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/invisible-playwright/$VERSION/json")
          case "$CODE" in
            200) echo "present=yes" >> "$GITHUB_OUTPUT"
                 echo "::notice::invisible-playwright $VERSION is already on the index. No-op, not a failure." ;;
            404) echo "present=no"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "the index answered $CODE for $VERSION, which is neither present" >&2
                 echo "nor absent. Refusing rather than guessing." >&2
                 exit 1 ;;
          esac

  gate:
    needs: already-published
    if: needs.already-published.outputs.present != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: the tag names the version being built
        # A tag pointing at a different version publishes something nobody asked
        # for, under a name that says otherwise. Skipped on workflow_dispatch,
        # where there is no tag to compare against.
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HAVE="${{ needs.already-published.outputs.version }}"
          if [ "$TAG" != "$HAVE" ]; then
            echo "tag v$TAG does not name the version in pyproject.toml ($HAVE)" >&2
            exit 1
          fi

      - name: the pinned invisible-core is ON THE INDEX
        # THE ordering rule, as a gate instead of a sentence in a runbook. This
        # package declares `invisible-core==X.Y.Z`, so pip resolves the PUBLISHED
        # core - and a consumer released against a core that is not there yet is
        # red on every runner and broken for every user while passing locally,
        # because the workbench core is an editable install and cannot see this
        # class of failure at all. Measured 2026-07-28: both consumers moved to a
        # name a new core had, neither release could resolve it.
        shell: bash
        run: |
          # BOTH spellings. PEP 503 normalises `invisible_core` and
          # `invisible-core` to the same project, and the dependency here is
          # written with the UNDERSCORE while every comment about it uses the
          # hyphen. Written against the prose first, this grep matched nothing
          # and the step exited 1 on a correct pyproject - caught by running it
          # by hand before the first release rather than during one.
          WANT=$(grep -oE 'invisible[-_]core==[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml                  | head -1 | cut -d= -f3)
          if [ -z "$WANT" ]; then
            echo "no exact invisible-core== pin found in pyproject.toml" >&2
            echo "(looked for invisible-core== and invisible_core==)" >&2
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/invisible-core/$WANT/json")
          if [ "$CODE" != "200" ]; then
            echo "invisible-core $WANT is not on the index (HTTP $CODE)." >&2
            echo "Publish the core FIRST, then this package. In this order every" >&2
            echo "install resolves; in the other one none of them do." >&2
            exit 1
          fi
          echo "::notice::invisible-core $WANT is on the index"

      - name: install the package and its dev extras
        # Its own step, BEFORE the arming below: install_hooks.py imports
        # invisible_core, and the first version of this file installed inside the
        # suite step, so the arming ran against a runner that had nothing
        # installed and died on ModuleNotFoundError. ci.yml has had this order
        # all along; this workflow had simply never run.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: arm the pre-push gates
        # The suite asserts core.hooksPath is set and a fresh checkout has none.
        run: python scripts/install_hooks.py

      - name: the suite
        # A tag push does not trigger the ordinary test workflow, which runs on
        # branches and pull requests. Without this, tagging is a way to publish
        # code no job has run.
        run: python -m pytest -q

  upload:
    needs: [already-published, gate]
    if: needs.already-published.outputs.present != 'yes'
    runs-on: ubuntu-latest
    environment: pypi          # the trust relationship lives HERE, behind the gate
    permissions:
      id-token: write          # trusted publishing; no token in a secret anywhere
      contents: write          # to commit the ledger entry back
      pull-requests: write     # and to open one when protection declines the push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: twine check
        run: |
          pip install twine
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: record what was published, and commit it back
        # The action above holds the OIDC credential and does the upload; the
        # thing that writes PUBLISHED.json is invisible_core.release. So the
        # first successful run of this workflow published 0.3.1 and recorded
        # nothing - re-creating, on its first green run, the exact gap that had
        # been back-filled by hand an hour earlier for 0.6.0 and 0.3.0.
        #
        # Recording the TREE is correct here and only here: this job is checked
        # out at the tag, so the tree is what was built and uploaded. A backfill
        # of a version published elsewhere must come from the artifacts the index
        # serves instead, because the tree has moved on.
        run: |
          # `-e .` and not `.[dev]`: this is the job holding the OIDC
          # credential and `contents: write`, and `record` needs the package
          # importable plus a build backend, nothing else. The dev extra
          # pulls pytest, ruff and - in the wrapper - the whole of
          # Playwright into the one job that can push to main.
          python -m pip install --quiet -e . build hatchling
          python -m invisible_core.release record
          if git diff --quiet -- PUBLISHED.json; then
            echo "::warning::nothing recorded - the ledger did not change"
            exit 0
          fi
          # The direct push CANNOT succeed while the branch requires status
          # checks: a required check cannot have passed on a commit that does
          # not exist yet, and this token has no bypass where a maintainer
          # push does. Measured 2026-08-05 - every publish run on all three
          # repos ended in failure with GH006, on releases that had shipped.
          # So the push is tried, and when declined the entry goes to a branch
          # and a pull request rather than nowhere. Green when it is
          # preserved, red only when it is lost.
          VERSION=$(python -c "import json;print(json.load(open('PUBLISHED.json'))['released'][-1]['version'])")
          git config user.name "feder-cr"
          git config user.email "85809106+feder-cr@users.noreply.github.com"
          git add PUBLISHED.json
          git commit -m "record $VERSION as published"
          BRANCH="${{ github.event.repository.default_branch }}"
          if git push origin "HEAD:$BRANCH"; then
            echo "::notice::ledger entry for $VERSION committed to $BRANCH"
            exit 0
          fi
          echo "the direct push was declined; falling back to a pull request"
          LEDGER_BRANCH="ledger/$VERSION"
          git push -f origin "HEAD:$LEDGER_BRANCH"
          CODE=$(curl -s -o /tmp/pr.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{\"title\":\"record $VERSION as published\",\"head\":\"$LEDGER_BRANCH\",\"base\":\"$BRANCH\",\"body\":\"The upload succeeded and the ledger could not be pushed to $BRANCH directly: branch protection declines this token, which has no bypass. Merging this keeps the next release from being refused over a missing entry.\"}")
          if [ "$CODE" = "201" ] || [ "$CODE" = "422" ]; then
            echo "::error::the ledger for $VERSION is NOT on $BRANCH. Branch $LEDGER_BRANCH carries it and a pull request is open (HTTP $CODE; 422 means one already exists). Merge it before the next release."
            exit 0
          fi
          echo "::error::the ledger entry for $VERSION could not be pushed OR turned into a pull request (HTTP $CODE). It exists only in this run. Back-fill it by hand from the artifacts the index serves."
          exit 1
