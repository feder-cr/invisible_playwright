# ─────────────────────────────────────────────────────────────────────────────
# e2e.yml - run the FULL browser-driving e2e suite (the 127 @pytest.mark.e2e)
# on GitHub, on every push/PR to main.
#
# Why this can run on CI when the drive-gate had to stay light: the drive-gate
# launched Firefox in true HEADLESS mode, which is content-process unstable on
# the hosted runners (eval-CSP / context-destroyed). The stealth wrapper instead
# launches Firefox HEADED on a real display; under `xvfb-run` (a virtual X
# server) that's exactly what we get on a headless CI box - stable, and the same
# thing webrtc-e2e.yml already relies on.
#
# Secret-free, so it's safe in public CI: the binary is the PUBLIC firefox-9
# release (no token), and the webrtc e2e fake a local TCP-only SOCKS. The proxy
# realness gate (fppro through a real proxy) is NOT here: it needs secrets and stays a
# local pre-release gate.
# ─────────────────────────────────────────────────────────────────────────────
name: e2e

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    # The same filter as `push` above, which had it and this one did not. A
    # docs-only PR (#54, deleting the Pages site) therefore spun up the full
    # browser bench, hung, and burned the whole 40-minute timeout on a change no
    # test can observe. The filter belongs on BOTH triggers or it is not a filter.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# One run of this workflow per branch at a time. A newer push cancels the older
# in-flight run as a whole, cleanly, instead of leaving its queued jobs to be
# cancelled one by one - which left the run marked failed even though nothing
# had actually failed. Keyed by workflow + ref so tests and e2e never cancel
# each other; only an older run of THIS workflow on the same branch is replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The install below resolves `invisible-core==N.M.0` from the package index,
  # and the core is published BEFORE this package. This gate answers whether it
  # is on the index yet; during that window the e2e job is SKIPPED with the
  # reason in the run summary rather than faked green, and once the core is up
  # it runs unchanged. See .github/workflows/core-on-index.yml.
  core-on-index:
    uses: ./.github/workflows/core-on-index.yml

  e2e:
    name: e2e (linux, xvfb)
    needs: core-on-index
    if: needs.core-on-index.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          # ⛔ The playwright package is NO LONGER a product dependency: the
          # client lives in invisible_playwright._pw and the driver in _driver. It
          # is installed here for ONE thing only, the `playwright install-deps
          # firefox` step below, which downloads the SYSTEM libraries Firefox
          # needs on a bare runner. The fork does not expose that subcommand
          # on purpose (it is meant to drive, not to be a toolchain).
          #
          # That the product does not IMPORT it is verified by tests/test_fork.py,
          # not from here: if someone one day reintroduced
          # `from playwright...` in src/, this line would mask it, and that is
          # exactly why that test exists.
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The protocol mirror agrees with the engine it is pinned to
        # `_juggler/protocol.py` is generated from the Protocol.js INSIDE the
        # shipped binary, and nothing used to tie the two together after a pin
        # bump: the mirror sat at 71 commands while the pinned engine declared
        # 75, with the unit test that fixes the count green the whole time,
        # because a count checks the mirror against itself. This is the only
        # job that has the binary, so this is where the comparison belongs.
        run: python scripts/gen_juggler_protocol.py --check --binary "$(dirname "$FF")"
      - name: Run the full e2e suite under a virtual display
        # PYTHONUNBUFFERED, and it is not a nicety. Without it Python block-buffers
        # stdout when it is a pipe, and this step printed NOTHING for 39 minutes
        # before the 40-minute timeout killed it on 2026-08-04: a run with no
        # verdict and no way to tell where it went. The variable is inherited by
        # the pytest subprocess run_e2e.py spawns, which is where the output
        # actually comes from.
        env:
          PYTHONUNBUFFERED: "1"
          # The watchdog in tests/conftest.py: at 150s inside ONE test it writes
          # HERE the stack of every thread, and repeats it. Two identical stacks say
          # stuck, two different ones say slow - opposite diagnoses that no other
          # tool distinguishes. To a FILE and not to stderr because pytest redirects
          # the descriptors at the system level: whatever is captured is lost
          # when the process is killed, which is exactly the case it exists for.
          INVPW_TEST_WATCHDOG_FILE: ${{ runner.temp }}/e2e-watchdog.log
        run: xvfb-run -a python -u scripts/run_e2e.py "$FF"

      # Runs ONLY if the step above fails, and before 2026-08-13 it could not
      # exist: the hang was killed by the 40-minute ceiling, so the job came out
      # `cancelled` and the following steps did not start at all. With
      # `--timeout 420 --timeout-method thread` the process dies at 7 minutes and the
      # step fails NORMALLY, so the evidence comes out from here.
      # A tool that cannot be seen is indistinguishable from one that does not exist.
      # The announcement the watchdog prints when it opens the file ends up
      # inside `pytest_runtest_setup`, which pytest CAPTURES: it does not show
      # up in the job log, so from there one could not tell "armed" from "inert".
      # This step asks the file instead, which is the only proof that exists.
      - name: Was the watchdog armed?
        if: always()
        run: |
          f="${RUNNER_TEMP}/e2e-watchdog.log"
          if [ -s "$f" ]; then
            # `|| true` is not cosmetic: `grep -c` that counts ZERO exits 1, and
            # GitHub runs `run:` blocks with `bash -e`. Without it, this step
            # died exactly on the HEALTHY runs - the ones with zero stacks - i.e.
            # it would have failed every green e2e. Found by executing the block
            # extracted from the YAML in all four states, not by rereading it.
            watched=$(grep -ac '^---' "$f" || true)
            stack=$(grep -ac 'Timeout' "$f" || true)
            echo "armed: ${watched} tests watched, ${stack} stacks written"
          else
            echo "::warning::the watchdog file is missing or empty: the tool was NOT armed, and a hang would leave nothing"
          fi

      # `always()` and not `failure()`: the file is needed even when the run is
      # green, because it is the only proof that the tool works.
      - name: Upload the hang evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14
