# TRIAL v4 — done properly. ONE clean leg (linux-arm64 native) to isolate variables.
# Visibility fixed for real: build runs under a PTY (`script -f`) so output is
# UNBUFFERED and streams live into build.log; the heartbeat also reports objdir
# SIZE + disk + sccache (signals that do NOT depend on stdout buffering) every
# 120s to the ci-progress branch, which we poll. Speed levers: --disable-debug-symbols,
# mold, sccache for C++ (+ CARGO_INCREMENTAL=0), 16G swap. No upload/sign/release.
name: crossbuild-trial

on:
  push:
    branches: [ci-crossbuild-trial]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trial:
    name: linux-arm64-native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - name: Free disk + 16G swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          echo "--- after ---"; df -h /; free -h

      - name: Checkout patched Firefox source (shallow)
        uses: actions/checkout@v4
        with:
          repository: feder-cr/invisible_firefox
          ref: stealth/150
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Install mold + util-linux (for PTY `script`)
        run: sudo apt-get update && sudo apt-get install -y mold bsdutils util-linux

      - name: Extend the repo's .mozconfig with speed levers (exactly ONE mozconfig)
        run: |
          test -f .mozconfig || { echo "ERROR: no .mozconfig in source tree"; exit 1; }
          rm -f mozconfig          # never have a SECOND default mozconfig (caused the v2/v3/v4 stall)
          cat >> .mozconfig <<'EOF'

          # --- speed levers appended by the trial CI (their .mozconfig already has
          # --- --enable-release/--disable-debug/tests/crashreporter/updater/--enable-bootstrap) ---
          ac_add_options --disable-debug-symbols
          ac_add_options --with-ccache=sccache
          ac_add_options --enable-linker=mold
          mk_add_options MOZ_PARALLEL_BUILD=4
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-trial
          EOF
          echo "----- final .mozconfig -----"; cat .mozconfig

      - name: Bootstrap build deps (non-interactive, bounded)
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
          MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
        run: |
          timeout 1800 ./mach bootstrap --no-interactive --application-choice=browser < /dev/null \
            || echo "bootstrap exited/timed out — continuing"

      - name: BUILD under PTY (live log) + heartbeat with objdir-size signal
        id: build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          CARGO_INCREMENTAL: "0"
          SCCACHE_CACHE_SIZE: "20G"
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git clone --depth 1 "https://x-access-token:${GH_PUSH_TOKEN}@github.com/feder-cr/invisible_playwright" hb 2>/dev/null
          ( cd hb && git checkout -B ci-progress && git config user.email ci@local && git config user.name ci-bot ) 2>/dev/null
          # PTY so output is UNBUFFERED -> build.log streams live. -f flush, -e return child rc, -c command.
          ( script -qefc './mach build' build.log >/dev/null 2>&1 ; echo $? > build.rc ) &
          BPID=$!
          START=$(date +%s)
          push_progress() {
            {
              echo "leg=linux-arm64-native  elapsed=$1 m  ($(date -u +%H:%M:%S) UTC)  state=$2"
              echo "objdir=$(du -sh obj-trial 2>/dev/null | cut -f1)  rootfree=$(df -h / | awk 'NR==2{print $4}')"
              echo "sccache: $(sccache --show-stats 2>/dev/null | grep -iE 'compile requests|cache hits|cache misses' | tr '\n' '|')"
              echo '---- build.log tail (live, PTY) ----'
              tail -22 build.log 2>/dev/null
            } > hb/progress.txt
            ( cd hb && git add -A && (git commit -q --amend --no-edit 2>/dev/null || git commit -q -m p 2>/dev/null); git push -f -q origin ci-progress ) 2>/dev/null || true
          }
          while kill -0 "$BPID" 2>/dev/null; do
            EL=$(( ($(date +%s) - START) / 60 ))
            push_progress "$EL" "building"
            sleep 120
          done
          wait "$BPID"; RC=$(cat build.rc 2>/dev/null || echo 1)
          EL=$(( ($(date +%s) - START) / 60 ))
          push_progress "$EL" "DONE rc=$RC"
          echo "=== BUILD exit=$RC after ${EL}m ==="
          echo "=== build.log tail (last 200) ==="; tail -200 build.log 2>/dev/null
          [ "$RC" = "0" ] && echo "finished=true" >> "$GITHUB_OUTPUT" || echo "finished=false" >> "$GITHUB_OUTPUT"

      - name: Report result
        run: |
          echo "finished=${{ steps.build.outputs.finished }}"
          du -sh obj-trial 2>/dev/null || true
          ls -la obj-trial/dist/bin/firefox 2>/dev/null && echo "FIREFOX BINARY PRODUCED" || echo "no binary"
          sccache --show-stats 2>/dev/null || true