# TRIAL v7 — the OTHER 4 targets, after v6 proved linux-arm64-native (cold build
# 58m, binary produced). Cross-compile recipe taken from camoufox's CI (read its
# Makefile/patch.py): the ONLY cross config needed is `ac_add_options --target=<triple>`
# + `rustup target add <triple>`; --enable-bootstrap (already in our .mozconfig)
# auto-fetches every cross toolchain via fetch-content — clang-cl+VS for Windows,
# the redistributable macOS SDK + cctools/ld64 for Darwin. No proprietary SDK to
# procure. mold only on Linux (Win uses lld-link, macOS uses ld64). The Win leg
# also re-adds the --disable-*{maintenance-service,update-agent,default-browser-agent}
# flags because our .mozconfig gates them on the HOST uname (wrong for cross).
# Each leg streams a live PTY log + objdir-size heartbeat to its own
# ci-progress-<leg> branch so 4 concurrent legs don't clobber each other.
name: crossbuild-trial

on:
  push:
    branches: [ci-crossbuild-trial]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trial:
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-x86_64
            runner: ubuntu-24.04
            triple: x86_64-pc-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            use_mold: "yes"
            win_disables: "no"
            extra_pkgs: "mold"
            bin: firefox
          - leg: win-x86_64
            runner: ubuntu-24.04
            triple: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            use_mold: "no"
            win_disables: "yes"
            extra_pkgs: "msitools p7zip-full"
            bin: firefox.exe
          - leg: macos-arm64
            runner: ubuntu-24.04
            triple: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            use_mold: "no"
            win_disables: "no"
            extra_pkgs: ""
            bin: firefox
          - leg: macos-x86_64
            runner: ubuntu-24.04
            triple: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            use_mold: "no"
            win_disables: "no"
            extra_pkgs: ""
            bin: firefox
    steps:
      - name: Free disk + 16G swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          echo "--- after ---"; df -h /; free -h

      - name: Checkout patched Firefox source (shallow)
        uses: actions/checkout@v4
        with:
          repository: feder-cr/invisible_firefox
          ref: stealth/150
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools (util-linux for PTY + per-leg extras)
        run: |
          sudo apt-get update
          sudo apt-get install -y util-linux ${{ matrix.extra_pkgs }}

      - name: Add Rust target for cross
        run: rustup target add ${{ matrix.rust_target }} || true

      - name: Extend the repo's .mozconfig with target + cold-build levers (ONE mozconfig)
        run: |
          test -f .mozconfig || { echo "ERROR: no .mozconfig in source tree"; exit 1; }
          rm -f mozconfig          # never a second default mozconfig
          {
            echo ""
            echo "# --- trial CI cross levers appended for ${{ matrix.leg }} ---"
            echo "ac_add_options --disable-debug-symbols"
            echo "ac_add_options --target=${{ matrix.triple }}"
          } >> .mozconfig
          if [ "${{ matrix.use_mold }}" = "yes" ]; then
            echo "ac_add_options --enable-linker=mold" >> .mozconfig
          fi
          if [ "${{ matrix.win_disables }}" = "yes" ]; then
            {
              echo "ac_add_options --disable-default-browser-agent"
              echo "ac_add_options --disable-maintenance-service"
              echo "ac_add_options --disable-update-agent"
            } >> .mozconfig
          fi
          {
            echo "mk_add_options MOZ_PARALLEL_BUILD=4"
            echo "mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-trial"
          } >> .mozconfig
          echo "----- final .mozconfig -----"; cat .mozconfig

      - name: BUILD under PTY (live log) + heartbeat with objdir-size signal
        id: build
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LEG="${{ matrix.leg }}"
          HBRANCH="ci-progress-${LEG}"
          git clone --depth 1 "https://x-access-token:${GH_PUSH_TOKEN}@github.com/feder-cr/invisible_playwright" hb 2>/dev/null
          ( cd hb && git checkout -B "$HBRANCH" && git config user.email ci@local && git config user.name ci-bot ) 2>/dev/null
          # PTY -> unbuffered live log. --enable-bootstrap (in .mozconfig) fetches cross toolchains during configure.
          ( script -qefc './mach build' build.log >/dev/null 2>&1 ; echo $? > build.rc ) &
          BPID=$!
          START=$(date +%s)
          push_progress() {
            {
              echo "leg=${LEG}  elapsed=$1 m  ($(date -u +%H:%M:%S) UTC)  state=$2"
              echo "objdir=$(du -sh obj-trial 2>/dev/null | cut -f1)  rootfree=$(df -h / | awk 'NR==2{print $4}')"
              echo '---- build.log tail (live, PTY) ----'
              tail -25 build.log 2>/dev/null
            } > hb/progress.txt
            ( cd hb && git add -A && (git commit -q --amend --no-edit 2>/dev/null || git commit -q -m p 2>/dev/null); git push -f -q origin "$HBRANCH" ) 2>/dev/null || true
          }
          while kill -0 "$BPID" 2>/dev/null; do
            EL=$(( ($(date +%s) - START) / 60 )); push_progress "$EL" "building"; sleep 120
          done
          wait "$BPID"; RC=$(cat build.rc 2>/dev/null || echo 1)
          EL=$(( ($(date +%s) - START) / 60 )); push_progress "$EL" "DONE rc=$RC"
          echo "=== BUILD exit=$RC after ${EL}m ==="
          echo "=== build.log tail (last 200) ==="; tail -200 build.log 2>/dev/null
          [ "$RC" = "0" ] && echo "finished=true" >> "$GITHUB_OUTPUT" || echo "finished=false" >> "$GITHUB_OUTPUT"

      - name: Report result
        run: |
          echo "leg=${{ matrix.leg }} finished=${{ steps.build.outputs.finished }}"
          du -sh obj-trial 2>/dev/null || true
          ls -la obj-trial/dist/bin/${{ matrix.bin }} 2>/dev/null && echo "BINARY PRODUCED (${{ matrix.bin }})" || echo "no binary"
          echo "--- dist/bin listing ---"; ls -la obj-trial/dist/bin/ 2>/dev/null | head -40 || true
