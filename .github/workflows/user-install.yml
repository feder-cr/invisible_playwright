# ─────────────────────────────────────────────────────────────────────────────
# user-install.yml - can a person who has never seen this repo install it and
# drive a browser, on the two operating systems we claim to support?
#
# WHY THIS EXISTS, SEPARATELY FROM e2e.yml.
# e2e.yml installs the wrapper FROM THE CHECKOUT and then pins Playwright by
# hand. That is the right shape for testing a change: it exercises the code in
# the PR. It is the wrong shape for answering "does the published thing work",
# and the difference is not academic:
#
#   * a checkout install never resolves `invisible-core==X.Y.Z` from the index,
#     so the entire pin mechanism - the part most likely to break a release,
#     and the reason a binary bump is now a three-package release - is outside
#     what that job can see;
#   * installing a blessed `playwright==<pin>` afterwards REPAIRS the venv. If
#     the declared range resolves to a client the shipped Juggler cannot speak,
#     that manual line turns the job green while every fresh install is broken.
#     What a user gets is what the installer resolves from the declaration,
#     and that is what has to be under test.
#
# So this workflow installs nothing from the checkout except the test files.
# test_release_e2e.py runs the README's install block for the runner's system
# as written - uv from its own installer, `uv init`, `uv add
# invisible-playwright` from the index, `fetch` - and then drives the browser
# from the project it made, the way somebody's first script would.
# test_upgrade_e2e.py stays on pip on purpose: it is the path of the people who
# installed before the README said uv, and they are still there.
#
# WHY IT MUST NOT BE MADE TOLERANT.
# There is a real window in which this cannot pass: between publishing the core
# and publishing the consumers. The tempting fixes - `|| true`, `--no-deps`, a
# git fallback - all produce a GREEN job that installed nothing, and that lie
# outlives the window by months. A red run during a publish is correct and
# readable. See core-on-index.yml, which makes the same argument at length.
#
# WHY BOTH OPERATING SYSTEMS.
# Windows is the primary target, and the two most recent defects were
# Windows-only by construction: firefox.exe is a launcher stub that spawns the
# real browser and exits, so a killed runner used to leave the tree behind, and
# the job-object fix for it has no counterpart on Linux. A Linux-only matrix
# would have seen neither.
# ─────────────────────────────────────────────────────────────────────────────
name: user-install

on:
  workflow_dispatch:
    inputs:
      source:
        description: "index (what users get) or git (an unpublished commit)"
        required: false
        default: index
        type: choice
        options: [index, git]
  schedule:
    # Weekly (Monday). The published artifacts do not change on their own, but
    # everything around them does: pip resolves a new Playwright, GitHub moves a
    # release asset, an index mirror lags. Those break users without any commit
    # here, so a run triggered only by pushes would never see them. Weekly is
    # enough to catch that drift without adding a Windows job to the queue daily.
    - cron: "17 6 * * 1"
  # ⛔ THE LEDGER PULL REQUEST, not `release: published` ([B347], core
  # 50.48.0). The Release is created by the publish workflow with GITHUB_TOKEN,
  # and an event that token causes starts no other workflow: on `release:` this
  # job had never run at release time. The ledger PR exists only after the
  # upload and `record`, and merging it waits for this run, so a release does
  # not close before what it published installs. `python -m
  # invisible_core.install_job` checks the wiring (tests.yml).
  pull_request:
    paths:
      - PUBLISHED.json

permissions:
  contents: read

# Only a new push to a ledger pull request cancels the run it supersedes. The
# weekly schedule and a manual run (both on main) never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: ${{ matrix.os }} - install from ${{ github.event.inputs.source || 'index' }} and launch
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false      # one OS failing must not hide the other's result
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # Only what the TEST needs (and `uv`, for the wait below to ask uv, which the release test installs the package with). The package under test is installed by the
      # test itself, into a venv it creates, from the index - installing it
      # here as well would put a second copy on the path and the assertions
      # would be reading the wrong one.
      - name: Test harness only
        run: python -m pip install --upgrade pip pytest packaging uv

      # PyPI does not serve a new version to pip the instant twine finishes, and
      # this workflow runs on the ledger pull request, which the publish run
      # opens seconds after the upload (it ran on `release:`, just as soon).
      # MEASURED 2026-07-28: invisible-firefox 0.2.6 was uploaded, the release was
      # created about forty seconds later, and the pip install below still resolved
      # 0.2.5. The job reported a forgotten publish that had happened two minutes
      # earlier, which is the most expensive kind of red: it looks exactly like the
      # real defect this workflow exists to catch.
      # MEASURED AGAIN 2026-11-12 (0.50.1, ledger #476): the per-version JSON endpoint
      # of PyPI answered at once, `pip index versions` listed 0.50.1, and the
      # `pip install --upgrade` of the Linux job still resolved 0.49.1 (the Windows job,
      # started later, was green). Those are three different pages of the index, and
      # the job only needs the one pip installs from.
      #
      # So the question asked here is the INSTALLERS' own, both: the upgrade test installs with pip, the release test with uv (the README's
      # way in), so each round asks `pip download invisible-playwright==X` AND `uv pip compile` of it (no cache, nothing installed), and the
      # job goes on only after three rounds in a row in which both said yes, 15 s apart (one yes proves that one request saw the version, not
      # that the next is served by the same node of the index); a no restarts the count and a call that does not answer in two minutes is
      # a no. Bounded at ten minutes: a forgotten publish still fails, and it fails HERE, saying that the index does not have the
      # version, instead of three steps later as a test that compares two versions.
      #
      # Only on the ledger pull request. A scheduled or dispatched run is not
      # racing anything, and a wait there would hide a real absence behind ten
      # minutes of polling.
      - name: wait for the index to serve this version
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile, time, tomllib
          dist = tomllib.load(open("pyproject.toml", "rb"))["project"]["name"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          deadline = time.monotonic() + 600
          deadline = min(deadline, time.monotonic() + float(os.environ.get("INDEX_WAIT_SECONDS", "600")))
          poll = float(os.environ.get("INDEX_WAIT_POLL", "15"))
          need = int(os.environ.get("INDEX_WAIT_CONFIRMATIONS", "3"))
          call_limit = float(os.environ.get("INDEX_WAIT_CALL_SECONDS", "120"))
          asks = [
              ("pip", [sys.executable, "-m", "pip", "download", "--no-deps", "--no-cache-dir", "--disable-pip-version-check", "--quiet",
                       "-d", tempfile.mkdtemp(), f"{dist}=={version}"], None),
              ("uv", [sys.executable, "-m", "uv", "pip", "compile", "-", "--no-deps", "--no-cache", "--quiet"], f"{dist}=={version}\n"),
          ]


          def round_says():
              """An empty string when every installer resolves the version, else what the first that did not said."""
              for tool, command, stdin in asks:
                  try:
                      r = subprocess.run(command, input=stdin, capture_output=True, text=True, timeout=call_limit)
                  except subprocess.TimeoutExpired:
                      return f"{tool} did not answer within {call_limit:.0f} s"
                  if r.returncode != 0:
                      return f"{tool} said: " + ((r.stderr.strip().splitlines() or [""])[-1])
              return ""


          n = streak = 0
          said = ""
          while True:
              n += 1
              said = round_says()
              streak = 0 if said else streak + 1
              if streak >= need:
                  print(f"::notice::pip and uv resolve {dist} {version} from the index, {need} rounds in a row (attempt {n})")
                  sys.exit(0)
              if time.monotonic() >= deadline:
                  minutes = int(float(os.environ.get("INDEX_WAIT_SECONDS", "600")) // 60) or 1
                  print(f"::error::the index does not have {dist} {version} yet, after {minutes} minutes "
                        f"and {n} attempts, {streak} of {need} rounds in a row ({said})")
                  sys.exit(1)
              time.sleep(poll)
          PY

      - name: Linux runtime libraries for the browser
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libdbus-glib-1-2 libasound2t64

      - name: The user path, end to end
        env:
          # The release walk asks the GitHub API once per published version.
          # Unauthenticated that is 60 calls an hour PER RUNNER IP, and the
          # walk hit 403 on its eleventh call when measured by hand. A
          # rate-limited walk SKIPS, and a skip is not a check.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVPW_E2E_SOURCE: ${{ github.event.inputs.source || 'index' }}
        shell: bash
        run: |
          set -o pipefail   # or the tee below would swallow pytest's exit code
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m pytest tests/test_release_e2e.py tests/test_upgrade_e2e.py -m e2e \
              -o addopts="" -v -rs | tee e2e-report.txt
          else
            python -m pytest tests/test_release_e2e.py tests/test_upgrade_e2e.py -m e2e \
              -o addopts="" -v -rs | tee e2e-report.txt
          fi

      # A run whose tests all SKIPPED is not a pass, and it is the failure this
      # suite is most exposed to: every test here is gated on `-m e2e` and
      # several on a platform. `-rs` above prints the skips; this turns "nothing
      # ran" into a refusal rather than a green tick.
      - name: Refuse a run in which nothing actually ran
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # pytest's own exit code cannot distinguish "all passed" from "all
          # skipped", so the count is read back from the report it wrote.
          report = pathlib.Path("e2e-report.txt")
          if not report.is_file():
              print("no report written; the step above did not run", file=sys.stderr)
              sys.exit(1)
          text = report.read_text(encoding="utf-8", errors="ignore")
          m = re.search(r"(\d+) passed", text)
          passed = int(m.group(1)) if m else 0
          if passed < 6:
              print(f"only {passed} test(s) actually ran (expected at least 6) - a suite that skipped "
                    f"itself is not a pass", file=sys.stderr)
              sys.exit(1)
          print(f"{passed} tests ran")
          PY
