# download-e2e-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/download-e2e**` branch.
#
# Two things on the engine of round 6, Linux and Windows, with the round's core and this branch's wrapper:
# 1. the download on a served browser read by Playwright's own client, against Playwright's own Firefox served by Playwright
#    (scripts/remote_download_repro.py, scripts/download_route_cases.py: fresh page, page reused after a route, unroute, a
#    context route that aborts images; the engine's download events recorded by the server);
# 2. tests/test_a_tiny_download_on_a_served_browser_is_saved_e2e.py on this branch (the fix of a download finished before it
#    was announced) and, in the same job, on the server of the commit before the fix (ff02f112), as the counter-proof.
name: download e2e hunt

on:
  push:
    branches: ['hunt/download-e2e**']

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  INVISIBLE_CORE_AUTOFIX: 'off'
  INVISIBLE_CORE_PIN: allow

jobs:
  hunt:
    name: download on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: This branch's wrapper, the round's core, the engine of round 6
        run: |
          set -e
          CORE_GIT="git+https://github.com/feder-cr/invisible_core@cc2f0cd47901fdfd8d266baf723e9fefffa46aac"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "$CORE_GIT"
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet --force-reinstall "$CORE_GIT"
          python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)" psutil websockets
          python -m playwright install --with-deps firefox || python -m playwright install firefox
          mkdir -p art ff
          if [ "$RUNNER_OS" = "Linux" ]; then
            gh run download 43203723323 --repo feder-cr/firefox_antidetect_patch --name asset-linux-x86_64 --dir art
            tar xzf art/firefox-*-stealth-linux-x86_64.tar.gz -C ff; EXE="$PWD/ff/firefox"
          else
            gh run download 43203723323 --repo feder-cr/firefox_antidetect_patch --name asset-win-x86_64 --dir art
            python -c "import glob, zipfile; zipfile.ZipFile(glob.glob('art/firefox-*-stealth-win-x86_64.*')[0]).extractall('ff')"
            EXE="$PWD/ff/firefox.exe"
          fi
          python -m invisible_core seal --binary "$EXE" --tag firefox-63-candidate -o "$PWD/seal.json"
          echo "FF=$EXE" >> "$GITHUB_ENV"
          echo "INVISIBLE_SEAL_FILE=$PWD/seal.json" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Linux" ]; then echo "RUN=xvfb-run -a" >> "$GITHUB_ENV"; else echo "RUN=" >> "$GITHUB_ENV"; fi
      - name: The download on a served browser, ours against Playwright's own
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          mkdir -p evidence
          cp scripts/remote_download_repro.py scripts/download_route_cases.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          $RUN python remote_download_repro.py --binary "$FF" --out "$GITHUB_WORKSPACE/evidence/repro.json" \
            --arms stock,ours-stock,ours-inprocess 2>&1 | tee "$GITHUB_WORKSPACE/evidence/repro.log"
          $RUN python download_route_cases.py --binary "$FF" --out "$GITHUB_WORKSPACE/evidence/route.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/route.log"
          {
            echo "## the download on a served browser, ${{ matrix.os }}"
            echo '```'
            grep -hE "^(stock|ours)" "$GITHUB_WORKSPACE/evidence/repro.log" "$GITHUB_WORKSPACE/evidence/route.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The tiny download e2e, on the fix and on the commit before it
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          export INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF"
          T=tests/test_a_tiny_download_on_a_served_browser_is_saved_e2e.py
          for n in 1 2 3; do
            $RUN python -m pytest "$T" -m e2e -o addopts= -p no:cacheprovider --timeout 300 -q -rA > "evidence/e2e_fix_$n.log" 2>&1
            echo "fix run $n: exit=$? $(tail -1 evidence/e2e_fix_$n.log)"
          done | tee evidence/e2e_fix.txt
          git show ff02f112fe:src/invisible_playwright/_juggler/server.py > src/invisible_playwright/_juggler/server.py
          for n in 1 2 3; do
            $RUN python -m pytest "$T" -m e2e -o addopts= -p no:cacheprovider --timeout 300 -q -rA > "evidence/e2e_old_$n.log" 2>&1
            echo "old run $n: exit=$? $(tail -1 evidence/e2e_old_$n.log)"
          done | tee evidence/e2e_old.txt
          git checkout -- src/invisible_playwright/_juggler/server.py
          {
            echo "## tiny download e2e, ${{ matrix.os }}"
            echo '```'
            cat evidence/e2e_fix.txt evidence/e2e_old.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Close every Firefox left
        if: always()
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then pkill -9 -f firefox || true; else taskkill //F //IM firefox.exe //T || true; fi
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: download-e2e-${{ matrix.os }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
