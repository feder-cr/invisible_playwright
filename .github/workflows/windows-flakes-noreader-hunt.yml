# windows-flakes-noreader-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/windows-flakes-noreader**` branch.
# Does the fix "no thread is started on the engine connection's reader" (wrapper fc9161f + core fix/no-thread-started-on-the-reader) cut the
# misses of goto(networkidle) on pages that replace themselves, that the Windows e2e shows? Windows only, two arms, same runner:
#   old = the wrapper of main + invisible-core==63.68.0 (the published one)
#   new = this checkout + the core of the branch fix/no-thread-started-on-the-reader (over the wheel, no deps)
# In both arms, for every /landed request: the time the server got it, the time the core's pipe reader read it, the time the lifecycle applied it.
name: windows flakes noreader hunt

on:
  push:
    branches: ['hunt/windows-flakes-noreader**']

permissions:
  contents: read

concurrency:
  group: windows-flakes-noreader-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"

jobs:
  hunt:
    name: noreader hunt windows
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: The wrapper of main, for the old arm (its tests come from it too)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          path: old
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Two environments, old and new
        run: |
          set -e
          BIN=Scripts; EXE=.exe
          OLDPY="$RUNNER_TEMP/venv-old/$BIN/python$EXE"
          NEWPY="$RUNNER_TEMP/venv-new/$BIN/python$EXE"
          echo "OLDPY=$OLDPY" >> "$GITHUB_ENV"
          echo "NEWPY=$NEWPY" >> "$GITHUB_ENV"
          echo "old wrapper: $(git -C old rev-parse HEAD)  new wrapper: $(git rev-parse HEAD)"
          CORE_SHA="$(timeout 300 git ls-remote https://github.com/oss-invisible/core.git refs/heads/fix/no-thread-started-on-the-reader)"
          echo "core branch: $CORE_SHA"
          test -n "$CORE_SHA" || { echo "the core branch is not on GitHub"; exit 1; }

          timeout 300 python -m venv "$RUNNER_TEMP/venv-old"
          timeout 300 "$OLDPY" -m pip install --quiet --upgrade pip
          # OLD: the wrapper of main (the checkout in old/, whose pyproject pins invisible_core==63.68.0) and that exact core
          timeout 300 "$OLDPY" -m pip install --quiet "./old[dev]" "invisible-core==63.68.0"
          timeout 300 "$OLDPY" -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"

          timeout 300 python -m venv "$RUNNER_TEMP/venv-new"
          timeout 300 "$NEWPY" -m pip install --quiet --upgrade pip
          timeout 300 "$NEWPY" -m pip install --quiet ".[dev]"
          timeout 300 "$NEWPY" -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          # NEW: the core of the branch over the wheel the wrapper pulled in
          timeout 300 "$NEWPY" -m pip install --quiet --force-reinstall --no-deps "invisible-core @ git+https://github.com/oss-invisible/core.git@fix/no-thread-started-on-the-reader"

          for py in "$OLDPY" "$NEWPY"; do
            echo "== $py"
            "$py" -m pip list 2>/dev/null | grep -iE "^(invisible|playwright|pytest-xdist)" || true
            "$py" -c "import invisible_core, invisible_playwright as w; print('core', invisible_core.__version__, invisible_core.__file__); print('wrapper', w.__file__)"
          done
      - name: Browsers, the lab GeoIP database, the binaries of both cores
        run: |
          set -e
          timeout 300 "$NEWPY" scripts/ci_lab_geoip.py build
          echo "FF_OLD=$(cd "$RUNNER_TEMP" && timeout 300 "$OLDPY" -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
          echo "FF_NEW=$(cd "$RUNNER_TEMP" && timeout 300 "$NEWPY" -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The same stamps in both cores (pipe reader chunk, lifecycle event)
        run: |
          set -e
          for py in "$OLDPY" "$NEWPY"; do
            timeout 300 "$py" scripts/hunt_trace_pipes.py
            timeout 300 "$py" scripts/hunt_trace_lifecycle.py
          done
      - name: The networkidle rows, four processes at once per arm, fifteen rounds, the order of the arms alternating
        run: |
          set +e
          mkdir -p evidence
          echo "binaries: old=$FF_OLD new=$FF_NEW"
          for n in $(seq 1 15); do
            if [ $((n % 2)) -eq 1 ]; then ORDER="old new"; else ORDER="new old"; fi
            for arm in $ORDER; do
              if [ "$arm" = old ]; then PY="$OLDPY"; BINARY="$FF_OLD"; else PY="$NEWPY"; BINARY="$FF_NEW"; fi
              for c in 1 2 3 4; do
                timeout 300 "$PY" -u scripts/hunt_netidle.py ours "$BINARY" "evidence/lc_${arm}_${n}_$c.jsonl" "evidence/pipe_${arm}_${n}_$c.txt" \
                  > "evidence/netidle_${arm}_${n}_$c.log" 2>&1 &
              done
              wait
              taskkill //F //T //IM firefox.exe > /dev/null 2>&1 || true
            done
            echo "round $n done ($ORDER)"
          done
          exit 0
      - name: Step summary
        if: always()
        run: |
          set +e
          {
            timeout 300 "$NEWPY" scripts/hunt_noreader_summary.py windows-2022 evidence
            echo
            echo "### Tracebacks and errors in the netidle logs"
            echo '```'
            grep -ahE "Traceback|Error" evidence/netidle_*.log | cut -c1-160 | sort | uniq -c | sort -rn | head -12
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Close every Firefox left
        if: always()
        run: |
          taskkill //F //T //IM firefox.exe > /dev/null 2>&1 || true
          exit 0
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-flakes-noreader-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
