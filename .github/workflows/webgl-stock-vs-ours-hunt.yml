name: "webgl-stock-vs-ours-hunt (the first WebGL context, our engine against Playwright Firefox and the official release)"

# A hunt, not a gate. The rate at which the FIRST WebGL context of a fresh browser comes back null on a loaded runner, for our engine and for Playwright's own
# Firefox and for the OFFICIAL Firefox 159 release (Selenium + geckodriver), in the same job, on the same Xvfb, alternating round by round: ours (headless=True, our
# Xvfb path), Playwright's Firefox headed under the job's Xvfb, Playwright's Firefox with its own headless, the official release headed under the Xvfb. Each round is a fresh browser, 38 cheap evaluations, then getContext('webgl') and ('webgl2') with the browser's reason (webglcontextcreationerror).
# PROCS processes at once beside NOISE loops of other WebGL/canvas modules. It starts on a push that touches .hunt/webgl-stock.trigger (NOT on a push of this
# file): the maintainer decides when the runners are free.

on:
  push:
    paths:
      - '.hunt/webgl-stock.trigger'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  PROCS: '4'
  NOISE: '2'
  ROUNDS: '40'

jobs:
  hunt:
    name: first webgl context, ours vs stock vs retail, 4 processes x 40 rounds x 4 modes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper + test deps, and Playwright's own Firefox as the control
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)" selenium
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
          python -m playwright install firefox
      - name: The official Firefox 159 release (tarball checked against the published sums)
        run: |
          base=https://archive.mozilla.org/pub/firefox/releases/159.0
          mkdir -p retail && cd retail
          curl -fsSL -O "$base/linux-x86_64/en-US/firefox-159.0.tar.xz"
          curl -fsSL -O "$base/SHA512SUMS"
          grep " linux-x86_64/en-US/firefox-159.0.tar.xz\$" SHA512SUMS | sed 's# linux-x86_64/en-US/# #' | sha512sum -c -
          tar xJf firefox-159.0.tar.xz
          echo "RETAIL_FIREFOX=$PWD/firefox/firefox" >> "$GITHUB_ENV"
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: Alternate, in PROCS processes, beside the noise
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p evidence
          export INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF" MOZ_CRASHREPORTER_DISABLE=1
          rm -f evidence/stop evidence/done.txt
          for n in $(seq 1 "$NOISE"); do
            (
              while [ ! -e evidence/stop ]; do
                for f in tests/test_webgl_draws_on_the_engine_s_own_gl_e2e.py tests/test_webgl_blending_rounds_once_e2e.py \
                         tests/test_webgl_mediump_is_full_precision_e2e.py tests/test_canvas_render_stealth.py; do
                  [ -e evidence/stop ] && break
                  xvfb-run -a python -m pytest "$f" -m e2e -q -p no:cacheprovider > /dev/null 2>&1 || true
                done
              done
            ) &
          done
          for p in $(seq 1 "$PROCS"); do
            (
              for r in $(seq 1 "$ROUNDS"); do
                for mode in ours stock-headed stock-headless retail-headed; do
                  xvfb-run -a python scripts/webgl_first_context_probe.py "$mode" "evidence/rows_p${p}.jsonl" 38 > /dev/null 2>&1 || true
                done
              done
              echo "p${p}" >> evidence/done.txt
            ) &
          done
          while [ "$(grep -c . evidence/done.txt 2>/dev/null || echo 0)" -lt "$PROCS" ]; do sleep 5; done
          touch evidence/stop
          wait || true
      - name: What was seen
        if: always()
        run: python scripts/webgl_probe_tally.py evidence
      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webgl-stock-vs-ours-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
