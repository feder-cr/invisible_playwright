# windows-flakes-engine-hunt.yml - hunt scaffolding, never merged. Runs only on a push to a `hunt/windows-flakes-engine**` branch.
# Where is a typed key's delay born inside the engine? The Juggler of our engine and of stock Playwright's Firefox is patched in its omni.ja
# (scripts/hunt_patch_omni.py) to stamp every Page.dispatchKeyEvent: parent receipt, content receipt, latency timer armed and fired, just
# before the DOM event; the page adds its handler time and the event's timeStamp. Typing core = branch fix/typing-on-absolute-deadlines
# (the "git" arm of windows-flakes-typing-hunt.yml). Arms: git and stock with the stamps, git_plain and stock_plain with the engine
# untouched (what the stamps cost). Windows: four processes at once, 20 runs per arm. Linux: alone, 20 runs per arm.
name: windows flakes engine hunt

on:
  push:
    branches: ['hunt/windows-flakes-engine**']

permissions:
  contents: read

concurrency:
  group: windows-flakes-engine-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  CORE_GIT: "git+https://github.com/oss-invisible/core@fix/typing-on-absolute-deadlines"

jobs:
  hunt:
    name: engine hunt ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          set -e
          timeout 300 python -m pip install --quiet --upgrade pip
          timeout 300 python -m pip install --quiet ".[dev]"
          timeout 300 python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          echo "FF=$(cd "$RUNNER_TEMP" && timeout 300 python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
          timeout 300 python scripts/ci_lab_geoip.py build
          if [ "$RUNNER_OS" = "Linux" ]; then timeout 300 python -m playwright install --with-deps firefox; else timeout 300 python -m playwright install firefox; fi
          STOCK_FF="$(python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.firefox.executable_path); p.stop()" | tail -1)"
          echo "STOCK_FF=$STOCK_FF" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then echo "HUNT_MODE=loaded" >> "$GITHUB_ENV"; else echo "HUNT_MODE=alone" >> "$GITHUB_ENV"; fi
          mkdir -p evidence
          echo "ours: $FF"; echo "stock: $STOCK_FF"
          ls -la "$(dirname "$STOCK_FF")" | head -50
      - name: Arm git, the core from the branch
        run: |
          set -e
          timeout 300 python -m pip install --quiet --force-reinstall --no-deps "$CORE_GIT"
          timeout 300 python scripts/hunt_typing_core.py | tee evidence/core_git.txt
          grep -q "(_due): True" evidence/core_git.txt || { echo "the branch's keyboard is not the one installed"; exit 1; }
      - name: Control arms, the engines untouched (git_plain, stock_plain)
        run: |
          set +e
          bash scripts/hunt_engine_arm.sh git_plain ours "$FF"
          bash scripts/hunt_engine_arm.sh stock_plain stock "$STOCK_FF"
      - name: Patch the Juggler of both engines (omni.ja next to the executable), stamps for Page.dispatchKeyEvent
        run: |
          set -e
          timeout 600 python scripts/hunt_patch_omni.py ours "$FF" 2>&1 | tee evidence/patch_ours.txt
          timeout 600 python scripts/hunt_patch_omni.py stock "$STOCK_FF" 2>&1 | tee evidence/patch_stock.txt
          grep -q "^PATCHED" evidence/patch_ours.txt && grep -q "^PATCHED" evidence/patch_stock.txt
      - name: Arms git and stock with the stamps
        env:
          HUNT_STAMPS: "1"
        run: |
          set +e
          bash scripts/hunt_engine_arm.sh git ours "$FF"
          # the stock driver copies the browser's output into its own log only with this
          DEBUG=pw:browser bash scripts/hunt_engine_arm.sh stock stock "$STOCK_FF"
      - name: Summary
        if: always()
        run: |
          set +e
          {
            sed 's/^/    /' evidence/core_git.txt 2>/dev/null
            timeout 300 python scripts/hunt_engine_summary.py evidence "$RUNNER_OS"
            echo
            echo '```'
            grep -ahE "Traceback|Error" evidence/alone_*.log evidence/loaded_*.log | sort | uniq -c | head -20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-flakes-engine-${{ matrix.os }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
