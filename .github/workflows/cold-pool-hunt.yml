name: cold-pool-hunt (one UDP e2e of the SOCKS5 line, repeated, with the engine's SOCKS logs)

# test_webrtc_realness.py::test_a_gather_after_the_page_loaded_through_the_gateway_costs_only_the_road_to_the_server was red once in 41 on Windows
# in the gate of run 43188313516: the srflx came at 1024 ms, four steps of 250 ms, as if the PeerConnection had opened a new association instead
# of taking a ready one. This job repeats THAT test on the engine of that run, in a fresh pytest process each time, with the engine's logs
# (MOZ_LOG timestamp,sync,append,SOCKS,SOCKS-UDP,signaling) in one folder per repetition and the wall-clock times of what the test gateway sees
# (tests/_hunt_plugin.py), keeps the red repetitions and three green ones as an artifact, and prints red/total and, for each red one, the sequence
# with times (scripts/cold_pool_report.py): first SOCKS5 connection, associations OK, PeerConnection, push of the UDP layer, and how many
# associations were ready at each push. A hunt, not a gate: it starts on a push that touches this file, and its verdict is the printed numbers.

on:
  push:
    paths:
      - '.github/workflows/cold-pool-hunt.yml'
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: 'run of feder-cr/firefox_antidetect_patch whose asset-win-x86_64 artifact is the engine'
        required: false
        default: ''
      core_ref:
        description: 'ref of feder-cr/invisible_core that run built the engine with'
        required: false
        default: ''
      repetitions:
        description: 'how many times the test runs'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  ENGINE_RUN_ID: ${{ inputs.engine_run_id || '43188313516' }}
  ENGINE_REPO: feder-cr/firefox_antidetect_patch
  CORE_REF: ${{ inputs.core_ref || 'candidate/core-63-r5' }}
  # The wrapper that drives this engine: the tests come from this branch (a branch of udp/wrapper-r5), the package under them from udp/wrapper-r5.
  WRAPPER_REF: udp/wrapper-r5
  SEAL_TAG: firefox-63-candidate
  REPETITIONS: ${{ inputs.repetitions || '150' }}
  TEST_ID: tests/test_webrtc_realness.py::test_a_gather_after_the_page_loaded_through_the_gateway_costs_only_the_road_to_the_server
  # The core under test is the one the engine was built with, whatever this wrapper pins.
  INVISIBLE_CORE_AUTOFIX: 'off'
  INVISIBLE_CORE_PIN: allow

jobs:
  hunt:
    name: cold-pool hunt (windows-2022, engine of run ${{ inputs.engine_run_id || '43188313516' }})
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: The core of the run, then the wrapper, then the core again over it
        run: |
          CORE_GIT="git+https://github.com/feder-cr/invisible_core@$CORE_REF"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "$CORE_GIT"
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet --force-reinstall --no-deps "git+https://github.com/feder-cr/invisible_playwright@$WRAPPER_REF"
          python -m pip install --quiet --force-reinstall "$CORE_GIT"
          python -c "import importlib.metadata as m; print('installed: invisible-playwright', m.version('invisible-playwright'), '| invisible-core', m.version('invisible-core'))"
          python - <<'PY'
          import json, os, subprocess, sys
          from importlib.metadata import distribution, version
          ref = os.environ["CORE_REF"]
          rows = [line.split() for line in subprocess.run(
              ["git", "ls-remote", "https://github.com/feder-cr/invisible_core", ref, ref + "^{}"],
              capture_output=True, text=True, check=True).stdout.splitlines() if line.strip()]
          peeled = [s for s, r in rows if r.endswith("^{}")]
          want = (peeled or [s for s, _ in rows] or [""])[0]
          import invisible_playwright  # noqa: F401 - the import-time pin check runs here, as under pytest
          raw = distribution("invisible-core").read_text("direct_url.json")
          got = (json.loads(raw).get("vcs_info") or {}).get("commit_id") if raw else None
          print("core under test: %s from %s" % (version("invisible-core"), got or "the index"))
          if not want or got != want:
              sys.exit("THE CORE UNDER TEST IS NOT CORE_REF %s: installed from %s, the ref is %s" % (ref, got or "the index", want or "unknown"))
          PY
      - name: The engine of the run
        run: |
          mkdir -p engine
          gh run download "$ENGINE_RUN_ID" --repo "$ENGINE_REPO" --name asset-win-x86_64 --dir engine/archive
          ls -la engine/archive
          python - <<'PY'
          import glob, zipfile
          z = glob.glob("engine/archive/*.zip")[0]
          zipfile.ZipFile(z).extractall("engine/x")
          print("extracted", z)
          PY
          python -m invisible_core seal --binary engine/x/firefox.exe --tag "$SEAL_TAG" -o "$PWD/engine/seal.json"
          echo "INVPW_BINARY_PATH=$PWD/engine/x/firefox.exe" >> "$GITHUB_ENV"
          echo "STEALTHFOX_E2E_BINARY=$PWD/engine/x/firefox.exe" >> "$GITHUB_ENV"
          echo "INVISIBLE_SEAL_FILE=$PWD/engine/seal.json" >> "$GITHUB_ENV"
      - name: The test once, as the gate runs it (is the machine able to run it at all)
        run: |
          python -m pytest "$TEST_ID" -m e2e -p no:cacheprovider -q -rA || echo "the single run was red or skipped, the hunt goes on"
      - name: The hunt
        id: hunt
        run: python scripts/cold_pool_hunt.py --test "$TEST_ID" --repetitions "$REPETITIONS" --out hunt --greens 3 | tee hunt-report.txt
      - name: The numbers in the summary
        if: always()
        run: |
          {
            echo '### cold-pool hunt'
            echo
            echo "engine run $ENGINE_RUN_ID, core $CORE_REF, $REPETITIONS repetitions"
            echo
            echo '```'
            grep -E '^=== [0-9]+ red' hunt-report.txt || echo 'no summary line: the hunt did not finish'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the logs of the red repetitions and of three green ones
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cold-pool-hunt-${{ github.run_id }}
          path: |
            hunt
            hunt-report.txt
          if-no-files-found: warn
          retention-days: 14
