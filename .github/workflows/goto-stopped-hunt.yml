name: goto stopped hunt
on:
  push:
    branches: [hunt/goto-stopped-timing]
env:
  GITHUB_TOKEN: ${{ github.token }}
concurrency:
  group: goto-stopped-hunt
  cancel-in-progress: true
jobs:
  hunt:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: Two CPU burners for the whole hunt (the contention of a full e2e leg)
        run: |
          for i in 1 2; do nohup python -c "while True: pass" > /dev/null 2>&1 & done
          echo started
      - name: 80 runs, four at once, under the burners
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_BINARY_PATH: ${{ env.FF }}
          STEALTHFOX_E2E_BINARY: ${{ env.FF }}
          HUNT_LOG: ${{ runner.temp }}/hunt-lines.log
        run: |
          python -m pytest -o addopts= -m e2e -p no:cacheprovider -n 4 --dist load -s -q \
            "tests/test_navigation_across_processes_e2e.py::test_a_goto_to_another_site_stopped_by_the_page_it_leaves_raises_aborted" \
            2>&1 | tee "$RUNNER_TEMP/hunt.log" | grep -E "passed|failed" || true
          echo "---- hunt lines"; cat "$RUNNER_TEMP/hunt-lines.log" || true
          echo "---- failed reps"; grep -E "FAILED" "$RUNNER_TEMP/hunt.log" | head -20 || true
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
